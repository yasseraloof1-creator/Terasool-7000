<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عاصفة الكيمياء">
<title>مؤسسة عاصفة الكيمياء</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;direction:rtl;color:#e2e8f0;padding-bottom:30px}
input,select,button{font-family:inherit;direction:rtl;color:#e2e8f0}
input::placeholder{color:#64748b}
.header{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.1);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-img{height:44px;width:44px;border-radius:10px;object-fit:cover}
.company-name{font-weight:800;font-size:15px}
.company-sub{font-size:11px;color:#94a3b8}
.header-btns{display:flex;gap:6px;flex-wrap:wrap}
.btn-export{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);color:#4ade80;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:600}
.btn-import-label{background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.4);color:#a5b4fc;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:600;display:inline-block}
.warn{border-radius:8px;padding:5px 10px;font-size:12px}
.warn-stock{background:rgba(245,158,11,0.2);border:1px solid #f59e0b;color:#fbbf24}
.warn-overdue{background:rgba(239,68,68,0.2);border:1px solid #ef4444;color:#f87171;cursor:pointer}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 16px 6px;border-bottom:none}
.nav-row2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 12px;border-bottom:1px solid rgba(255,255,255,0.08)}
.nav-btn{padding:9px 4px;border-radius:10px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:rgba(255,255,255,0.07);color:#94a3b8;text-align:center;width:100%}
.nav-btn.active{background:linear-gradient(135deg,#e64980,#cc5de8);color:white}
.content{padding:16px;max-width:820px;margin:0 auto}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:16px;margin-bottom:12px}
.card-green{background:rgba(22,163,74,0.08);border-color:rgba(22,163,74,0.3)}
.card-edit{border-color:#cc5de8!important}
.inp{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);color:#e2e8f0;font-size:14px;outline:none}
.inp option{background:#1e2a3a}
label.lbl{display:block;margin-bottom:5px;font-size:13px;color:#94a3b8}
.btn{padding:10px 16px;border-radius:8px;border:none;background:linear-gradient(135deg,#e64980,#cc5de8);color:white;font-size:14px;font-weight:700;cursor:pointer;width:100%}
.btn-green{background:linear-gradient(135deg,#16a34a,#15803d)}
.btn-ghost{background:rgba(255,255,255,0.08);color:#94a3b8}
.btn-blue{background:rgba(99,102,241,0.2);color:#a5b4fc;border:none;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:700}
.btn-danger{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.empty{text-align:center;padding:50px 20px;background:rgba(255,255,255,0.04);border-radius:12px;color:#64748b}
.price-box{background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);border-radius:8px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center}
.price-total{font-size:16px;font-weight:700;color:#fbbf24}
.price-label{font-size:13px;color:#94a3b8}
.alert-box{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;color:white;padding:12px 24px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.3);font-weight:600;font-size:14px;display:none;white-space:nowrap}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:998;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#1e2a3a;border:1px solid rgba(255,255,255,0.15);border-radius:16px;padding:24px;width:100%;max-width:420px}
h2{font-size:19px;font-weight:700;margin-bottom:12px}
.status-badge{border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.rpd{font-size:12px;color:#fbbf24;margin-top:3px}
</style>
</head>
<body>
<div class="alert-box" id="alertBox"></div>
<div class="modal-overlay" id="applyModal">
  <div class="modal">
    <h3 style="margin-bottom:4px">🧪 تطبيق خلطة</h3>
    <p id="applyModalName" style="color:#94a3b8;font-size:14px;margin-bottom:14px"></p>
    <label class="lbl">كم مرة تريد تطبيق الخلطة؟</label>
    <input type="number" min="1" value="1" id="applyQtyInput" class="inp" style="text-align:center;font-size:18px;margin-bottom:6px" oninput="updateApplyPreview()">
    <div style="font-size:12px;color:#64748b;text-align:center;margin-bottom:12px">مثال: 1 = دفعة واحدة</div>
    <div id="applyModalItems" style="background:rgba(255,255,255,0.04);border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px;color:#94a3b8"></div>
    <div id="applyTotalPrice"></div>
    <label class="lbl" style="margin-top:10px">العميل (اختياري)</label>
    <select id="applyCustomer" class="inp" style="margin-bottom:10px"><option value="">بدون عميل</option></select>
    <label class="lbl">سعر البيع للزبون (ريال، اختياري)</label>
    <input type="number" id="applySalePrice" class="inp" placeholder="مثال: 500" style="margin-bottom:6px" oninput="updateApplyPreview()">
    <div id="applyProfitBox"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeApplyModal()">إلغاء</button>
      <button class="btn" style="flex:2" onclick="confirmApply()">✅ تأكيد الخصم</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="saleModal">
  <div class="modal">
    <h3 style="margin-bottom:4px">💵 بيع مادة خام</h3>
    <p id="saleModalName" style="color:#94a3b8;font-size:14px;margin-bottom:14px"></p>
    <label class="lbl">الكمية المباعة</label>
    <input type="number" id="saleQtyInput" class="inp" style="margin-bottom:10px" oninput="updateSalePreview()">
    <label class="lbl">العميل (اختياري)</label>
    <select id="saleCustomer" class="inp" style="margin-bottom:10px"><option value="">بدون عميل</option></select>
    <label class="lbl">سعر البيع الإجمالي (ريال، اختياري)</label>
    <input type="number" id="saleSalePrice" class="inp" placeholder="مثال: 200" style="margin-bottom:8px" oninput="updateSalePreview()">
    <div id="saleProfitBox"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeSaleModal()">إلغاء</button>
      <button class="btn" style="flex:2" onclick="confirmSale()">✅ تأكيد البيع</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="custModal">
  <div class="modal">
    <h3 style="margin-bottom:14px" id="custModalTitle">👤 عميل جديد</h3>
    <label class="lbl">اسم العميل</label><input id="cName" class="inp" style="margin-bottom:10px">
    <label class="lbl">رقم الهاتف</label><input id="cPhone" class="inp" style="margin-bottom:10px">
    <label class="lbl">الموقع</label><input id="cLocation" class="inp" style="margin-bottom:10px">
    <label class="lbl">الرقم الضريبي</label><input id="cTaxId" class="inp" style="margin-bottom:14px">
    <div class="row">
      <button class="btn btn-ghost" style="flex:1" onclick="closeCustModal()">إلغاء</button>
      <button class="btn" style="flex:2" onclick="saveCustomer()">💾 حفظ</button>
    </div>
  </div>
</div>

  <div class="logo-wrap">

    <span class="warn warn-overdue" id="overdueWarn" style="display:none" onclick="showView('maintenance')"></span>
    <button class="btn-export" onclick="exportData()">⬇️ تصدير</button>
    <label class="btn-import-label">⬆️ استيراد<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
  </div>
</div>
<div class="nav">
  <button class="nav-btn active" id="tab-inventory" onclick="showView('inventory')">📦 المخزون</button>
  <button class="nav-btn" id="tab-addMaterial" onclick="showView('addMaterial')">➕ إضافة مواد</button>
  <button class="nav-btn" id="tab-savedFormulas" onclick="showView('savedFormulas')">🧪 الخلطات</button>
  <button class="nav-btn" id="tab-approvedFormulas" onclick="showView('approvedFormulas')">✅ المعتمدة</button>
</div>
<div class="nav-row2">
  <button class="nav-btn" id="tab-history" onclick="showView('history')">📋 السجل</button>
  <button class="nav-btn" id="tab-maintenance" onclick="showView('maintenance')">🔧 المواعيد</button>
  <button class="nav-btn" id="tab-sales" onclick="showView('sales')">💵 المبيعات</button>
  <button class="nav-btn" id="tab-customers" onclick="showView('customers')">👤 العملاء</button>
</div>
<div class="content" id="mainContent"></div>
<script>

const SK="paint_factory_v2";
let S={materials:[],history:[],savedFormulas:[],approvedFormulas:[],tasks:[],archivedHistory:{},customers:[],sales:[]};
let currentView="inventory",applyingId=null,editingMatId=null,editingFormulaId=null;

function save(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}updateWarnings();}
function load(){try{const s=localStorage.getItem(SK);if(s){const p=JSON.parse(s);S={materials:p.materials||[],history:p.history||[],savedFormulas:p.savedFormulas||[],approvedFormulas:p.approvedFormulas||[],tasks:p.tasks||[],archivedHistory:p.archivedHistory||{},customers:p.customers||[],sales:p.sales||[]};migrateOldEntries();}}catch(e){}}

let aT;
function showAlert(msg,type){const el=document.getElementById("alertBox");el.textContent=msg;el.style.background=type==="error"?"#ef4444":"#22c55e";el.style.display="block";clearTimeout(aT);aT=setTimeout(()=>el.style.display="none",3000);}

function updateWarnings(){
  const low=S.materials.filter(m=>m.quantity<10);
  const lw=document.getElementById("lowStockWarn");
  if(lw){lw.style.display=low.length?"":"none";lw.textContent="⚠️ "+low.length+" مواد منخفضة";}
  const ov=S.tasks.filter(t=>{const d=getDaysLeft(t);return d!==null&&d<0;});
  const ow=document.getElementById("overdueWarn");
  if(ow){ow.style.display=ov.length?"":"none";ow.textContent="🔧 "+ov.length+" مهام متأخرة";}
}

function showView(v){
  currentView=v;editingMatId=null;editingFormulaId=null;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  const t=document.getElementById("tab-"+v);if(t)t.classList.add("active");
  render();
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function getStockColor(q){return q<=0?"#ef4444":q<10?"#f59e0b":"#22c55e";}
function getDaysLeft(t){if(!t.lastDone)return null;const n=new Date(t.lastDone);n.setDate(n.getDate()+t.intervalDays);return Math.ceil((n-new Date())/864e5);}
function getTaskColor(d){return d===null?"#94a3b8":d<0?"#ef4444":d<=3?"#f59e0b":"#22c55e";}
function getTaskStatus(d){return d===null?"لم تُنجز بعد":d<0?"متأخر "+Math.abs(d)+" يوم":d===0?"اليوم!":"بعد "+d+" يوم";}
function iLabel(d){return({1:"كل يوم",7:"كل أسبوع",14:"كل أسبوعين",30:"كل شهر",60:"كل شهرين",90:"كل 3 أشهر",180:"كل 6 أشهر",365:"كل سنة"})[d]||"كل "+d+" يوم";}
function fTotal(rows){return rows.reduce((s,r)=>{const m=S.materials.find(m=>m.id===r.materialId);return m&&m.pricePerUnit&&r.amount?s+m.pricePerUnit*parseFloat(r.amount):s;},0);}

function exportData(){
  const blob=new Blob([JSON.stringify({...S,exportedAt:new Date().toLocaleString("ar-SA")},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="عاصفة-الكيمياء-"+new Date().toISOString().split("T")[0]+".json";a.click();
  showAlert("تم تصدير البيانات ✅");
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      if(!p.materials){showAlert("ملف غير صحيح","error");return;}
      S={materials:p.materials||[],history:p.history||[],savedFormulas:p.savedFormulas||[],approvedFormulas:p.approvedFormulas||[],tasks:p.tasks||[],archivedHistory:p.archivedHistory||{},customers:p.customers||[],sales:p.sales||[]};
      save();render();showAlert("تم الاستيراد ✅");
    }catch{showAlert("خطأ في الملف","error");}
  };
  r.readAsText(f);e.target.value="";
}

function addMaterial(){
  const name=document.getElementById("mName").value.trim();
  const qty=parseFloat(document.getElementById("mQty").value);
  const unit=document.getElementById("mUnit").value;
  const price=parseFloat(document.getElementById("mPrice").value)||0;
  const notes=document.getElementById("mNotes").value.trim();
  const link=document.getElementById("mLink").value.trim();
  if(!name||isNaN(qty)||qty<=0){showAlert("الرجاء ملء الحقول بشكل صحيح","error");return;}
  const ex=S.materials.find(m=>m.name===name);
  if(ex){S.materials=S.materials.map(m=>m.name===name?{...m,quantity:m.quantity+qty}:m);showAlert("تمت الإضافة على الموجود");}
  else{S.materials.push({id:Date.now().toString(),name,unit,quantity:qty,pricePerUnit:price,notes:notes||"",link:link||""});showAlert("تمت إضافة: "+name);}
  save();showView("inventory");
}
function deleteMaterial(id){if(!confirm("حذف هذه المادة؟"))return;S.materials=S.materials.filter(m=>m.id!==id);save();render();showAlert("تم الحذف","error");}
function startEditMat(id){editingMatId=id;render();}
function cancelEditMat(){editingMatId=null;render();}
function saveMat(){
  const name=document.getElementById("eName").value.trim();
  const qty=parseFloat(document.getElementById("eQty").value);
  const unit=document.getElementById("eUnit").value;
  const price=parseFloat(document.getElementById("ePrice").value)||0;
  const notes=document.getElementById("eNotes").value.trim();
  const link=document.getElementById("eLink").value.trim();
  if(!name||isNaN(qty)||qty<=0){showAlert("الرجاء ملء الحقول","error");return;}
  S.materials=S.materials.map(m=>m.id===editingMatId?{...m,name,unit,quantity:qty,pricePerUnit:price,notes:notes||"",link:link||""}:m);
  editingMatId=null;save();render();showAlert("تم حفظ التعديل ✅");
}

function createFormula(){
  const f={id:Date.now().toString(),name:"خلطة جديدة",rows:[{materialId:"",amount:""}]};
  S.savedFormulas.push(f);editingFormulaId=f.id;save();showView("savedFormulas");
}
function deleteFormula(id){S.savedFormulas=S.savedFormulas.filter(f=>f.id!==id);save();render();showAlert("تم الحذف","error");}
function startEditFormula(id){editingFormulaId=id;render();}
function cancelEditFormula(){
  const f=S.savedFormulas.find(f=>f.id===editingFormulaId);
  if(f&&f.name==="خلطة جديدة"&&f.rows.length===1&&!f.rows[0].materialId)
    S.savedFormulas=S.savedFormulas.filter(f=>f.id!==editingFormulaId);
  editingFormulaId=null;render();
}
function addEditRow(){
  const c=document.getElementById("editRows");
  const d=document.createElement("div");
  d.className="edit-row";
  d.style.marginBottom="8px";
  const sel=document.createElement("select");
  sel.className="inp edit-mat";sel.style.flex="2";
  sel.innerHTML='<option value="">اختر المادة</option>'+S.materials.map(m=>'<option value="'+m.id+'">'+m.name+' ('+m.quantity+' '+m.unit+')</option>').join('');
  const inp=document.createElement("input");
  inp.type="number";inp.placeholder="الكمية";inp.className="inp edit-amt";inp.style.flex="1";
  const btn=document.createElement("button");
  btn.textContent="✕";btn.onclick=function(){d.remove();updateFTotal();};
  btn.style.cssText="background:rgba(239,68,68,0.15);border:none;color:#f87171;border-radius:8px;padding:10px;cursor:pointer;flex-shrink:0";
  const priceDiv=document.createElement("div");priceDiv.className="rpd";
  sel.onchange=()=>updateRP(inp,sel,priceDiv);
  inp.oninput=()=>updateRP(inp,sel,priceDiv);
  const row=document.createElement("div");row.className="row";
  row.appendChild(sel);row.appendChild(inp);row.appendChild(btn);
  d.appendChild(row);d.appendChild(priceDiv);
  c.appendChild(d);
}
function updateRP(inp,sel,div){
  const m=S.materials.find(m=>m.id===sel.value);
  const amt=parseFloat(inp.value);
  div.textContent=(m&&m.pricePerUnit&&amt)?"💰 "+(m.pricePerUnit*amt).toFixed(2)+" ريال":"";
  div.style.cssText="font-size:12px;color:#fbbf24;margin-top:3px";
  updateFTotal();
}
function updateFTotal(){
  let total=0;
  document.querySelectorAll(".edit-row").forEach(row=>{
    const sel=row.querySelector(".edit-mat");
    const inp=row.querySelector(".edit-amt");
    const m=S.materials.find(m=>m.id===sel?.value);
    if(m&&m.pricePerUnit&&inp?.value)total+=m.pricePerUnit*parseFloat(inp.value);
  });
  const tb=document.getElementById("fTotalBox");
  if(tb){tb.style.display=total>0?"flex":"none";const sp=tb.querySelector(".price-total");if(sp)sp.textContent=total.toFixed(2)+" ريال";}
}
function saveFormula(){
  const name=document.getElementById("editName").value.trim();
  if(!name){showAlert("الرجاء كتابة اسم","error");return;}
  const rows=[];let ok=true;
  document.querySelectorAll(".edit-row").forEach(row=>{
    const mid=row.querySelector(".edit-mat")?.value;
    const amt=row.querySelector(".edit-amt")?.value;
    if(!mid||!amt)ok=false;else rows.push({materialId:mid,amount:amt});
  });
  if(!ok||!rows.length){showAlert("الرجاء اكمال جميع المواد","error");return;}
  S.savedFormulas=S.savedFormulas.map(f=>f.id===editingFormulaId?{...f,name,rows}:f);
  editingFormulaId=null;save();render();showAlert("تم حفظ الخلطة ✅");
}
function approveFormula(id){
  const f=S.savedFormulas.find(f=>f.id===id);
  if(!f||f.rows.some(r=>!r.materialId||!r.amount)){showAlert("الخلطة غير مكتملة","error");return;}
  S.approvedFormulas.push({...f,approvedAt:new Date().toLocaleString("ar-SA")});
  S.savedFormulas=S.savedFormulas.filter(f=>f.id!==id);
  save();render();showAlert("تم اعتماد "+f.name+" ✅");
}
function moveToEdit(id){
  const f=S.approvedFormulas.find(f=>f.id===id);if(!f)return;
  const{approvedAt,...rest}=f;
  S.savedFormulas.push(rest);
  S.approvedFormulas=S.approvedFormulas.filter(f=>f.id!==id);
  save();showView("savedFormulas");showAlert("تم إرجاع "+f.name+" للتعديل");
}
function deleteApproved(id){S.approvedFormulas=S.approvedFormulas.filter(f=>f.id!==id);save();render();showAlert("تم الحذف","error");}
function custOptions(selId){
  return '<option value="">بدون عميل</option>'+S.customers.map(c=>'<option value="'+c.id+'"'+(c.id===selId?' selected':'')+'>'+esc(c.name)+'</option>').join('');
}
function openApplyModal(id){
  applyingId=id;
  const f=S.approvedFormulas.find(f=>f.id===id);
  document.getElementById("applyModalName").textContent=f.name;
  document.getElementById("applyQtyInput").value=1;
  document.getElementById("applySalePrice").value="";
  document.getElementById("applyCustomer").innerHTML=custOptions();
  document.getElementById("applyModal").classList.add("open");
  updateApplyPreview();
}
function closeApplyModal(){document.getElementById("applyModal").classList.remove("open");applyingId=null;}
function updateApplyPreview(){
  const f=S.approvedFormulas.find(f=>f.id===applyingId);if(!f)return;
  const qty=parseFloat(document.getElementById("applyQtyInput").value)||1;
  let html="",total=0;
  f.rows.forEach((row,i)=>{
    const m=S.materials.find(m=>m.id===row.materialId);
    const amt=(parseFloat(row.amount)*qty).toFixed(2);
    const rp=m&&m.pricePerUnit?(m.pricePerUnit*parseFloat(amt)).toFixed(2):null;
    if(rp)total+=parseFloat(rp);
    html+='<div style="display:flex;justify-content:space-between;padding:3px 0'+(i>0?';border-top:1px solid rgba(255,255,255,0.05)':'')+'"><span>'+(m?m.name:'؟')+'</span><div><span style="color:#f87171">- '+amt+' '+(m?m.unit:'')+'</span>'+(rp?'<span style="color:#fbbf24;margin-right:8px">'+rp+' ر</span>':'')+'</div></div>';
  });
  document.getElementById("applyModalItems").innerHTML=html;
  const tb=document.getElementById("applyTotalPrice");
  tb.innerHTML=total>0?'<div class="price-box"><span class="price-label">💰 إجمالي التكلفة</span><span class="price-total">'+total.toFixed(2)+' ريال</span></div>':'';
  const salePrice=parseFloat(document.getElementById("applySalePrice").value);
  const pb=document.getElementById("applyProfitBox");
  if(!isNaN(salePrice)&&salePrice>0){
    const profit=salePrice-total;
    pb.innerHTML='<div class="price-box" style="margin-top:8px;border-color:'+(profit>=0?'rgba(34,197,94,0.4)':'rgba(239,68,68,0.4)')+'"><span class="price-label">'+(profit>=0?'📈 الربح':'📉 الخسارة')+'</span><span class="price-total" style="color:'+(profit>=0?'#4ade80':'#f87171')+'">'+Math.abs(profit).toFixed(2)+' ريال</span></div>';
  } else pb.innerHTML="";
}
function confirmApply(){
  const f=S.approvedFormulas.find(f=>f.id===applyingId);
  const qty=parseFloat(document.getElementById("applyQtyInput").value);
  if(!f||isNaN(qty)||qty<=0){showAlert("كمية غير صحيحة","error");return;}
  const updates=[];
  let cost=0;
  for(const row of f.rows){
    const m=S.materials.find(m=>m.id===row.materialId);
    const amt=parseFloat(row.amount)*qty;
    if(!m){showAlert("مادة غير موجودة","error");return;}
    if(m.quantity<amt){showAlert("المخزون غير كافٍ لـ "+m.name,"error");return;}
    updates.push({id:m.id,name:m.name,unit:m.unit,used:amt});
    if(m.pricePerUnit)cost+=m.pricePerUnit*amt;
  }
  S.materials=S.materials.map(m=>{const u=updates.find(u=>u.id===m.id);return u?{...m,quantity:+(m.quantity-u.used).toFixed(3)}:m;});
  const custId=document.getElementById("applyCustomer").value;
  const cust=S.customers.find(c=>c.id===custId);
  const salePrice=parseFloat(document.getElementById("applySalePrice").value)||0;
  const entry={id:Date.now(),date:new Date().toLocaleString("ar-SA"),year:new Date().getFullYear(),name:f.name+(qty>1?" (×"+qty+")":""),items:updates.map(u=>({name:u.name,used:u.used,unit:u.unit})),customerId:custId||null,customerName:cust?cust.name:null,cost:+cost.toFixed(2),salePrice:salePrice,profit:salePrice?+(salePrice-cost).toFixed(2):null};
  S.history.unshift(entry);
  if(cust){if(!cust.purchases)cust.purchases=[];cust.purchases.unshift({type:"formula",date:entry.date,name:entry.name,cost:entry.cost,salePrice:entry.salePrice,profit:entry.profit});}
  closeApplyModal();save();showView("inventory");showAlert("تم تطبيق "+f.name+" ✅");
}

// ===== Sales (selling raw materials directly) =====
let sellingMatId=null;
function openSaleModal(matId){
  sellingMatId=matId;
  const m=S.materials.find(m=>m.id===matId);
  document.getElementById("saleModalName").textContent=m.name+" — متوفر: "+m.quantity+" "+m.unit;
  document.getElementById("saleQtyInput").value="";
  document.getElementById("saleSalePrice").value="";
  document.getElementById("saleCustomer").innerHTML=custOptions();
  document.getElementById("saleProfitBox").innerHTML="";
  document.getElementById("saleModal").classList.add("open");
}
function closeSaleModal(){document.getElementById("saleModal").classList.remove("open");sellingMatId=null;}
function updateSalePreview(){
  const m=S.materials.find(m=>m.id===sellingMatId);if(!m)return;
  const qty=parseFloat(document.getElementById("saleQtyInput").value);
  const salePrice=parseFloat(document.getElementById("saleSalePrice").value);
  const pb=document.getElementById("saleProfitBox");
  if(!isNaN(qty)&&qty>0&&m.pricePerUnit&&!isNaN(salePrice)&&salePrice>0){
    const cost=m.pricePerUnit*qty;
    const profit=salePrice-cost;
    pb.innerHTML='<div class="price-box" style="border-color:'+(profit>=0?'rgba(34,197,94,0.4)':'rgba(239,68,68,0.4)')+'"><span class="price-label">'+(profit>=0?'📈 الربح':'📉 الخسارة')+'</span><span class="price-total" style="color:'+(profit>=0?'#4ade80':'#f87171')+'">'+Math.abs(profit).toFixed(2)+' ريال</span></div>';
  } else pb.innerHTML="";
}
function confirmSale(){
  const m=S.materials.find(m=>m.id===sellingMatId);
  const qty=parseFloat(document.getElementById("saleQtyInput").value);
  if(!m||isNaN(qty)||qty<=0){showAlert("كمية غير صحيحة","error");return;}
  if(m.quantity<qty){showAlert("المخزون غير كافٍ","error");return;}
  const custId=document.getElementById("saleCustomer").value;
  const cust=S.customers.find(c=>c.id===custId);
  const salePrice=parseFloat(document.getElementById("saleSalePrice").value)||0;
  const cost=m.pricePerUnit?m.pricePerUnit*qty:0;
  S.materials=S.materials.map(mm=>mm.id===m.id?{...mm,quantity:+(mm.quantity-qty).toFixed(3)}:mm);
  const entry={id:Date.now(),date:new Date().toLocaleString("ar-SA"),year:new Date().getFullYear(),materialName:m.name,qty:qty,unit:m.unit,cost:+cost.toFixed(2),salePrice:salePrice,profit:salePrice?+(salePrice-cost).toFixed(2):null,customerId:custId||null,customerName:cust?cust.name:null};
  S.sales.unshift(entry);
  if(cust){if(!cust.purchases)cust.purchases=[];cust.purchases.unshift({type:"material",date:entry.date,name:m.name+" ("+qty+" "+m.unit+")",cost:entry.cost,salePrice:entry.salePrice,profit:entry.profit});}
  closeSaleModal();save();render();showAlert("تم تسجيل بيع "+m.name+" ✅");
}
function deleteSale(id){S.sales=S.sales.filter(s=>s.id!==id);save();render();showAlert("تم الحذف","error");}

// ===== Customers =====
let editingCustId=null;
function openCustModal(id){
  editingCustId=id||null;
  const c=id?S.customers.find(c=>c.id===id):null;
  document.getElementById("custModalTitle").textContent=id?"✏️ تعديل عميل":"👤 عميل جديد";
  document.getElementById("cName").value=c?c.name:"";
  document.getElementById("cPhone").value=c?c.phone:"";
  document.getElementById("cLocation").value=c?c.location:"";
  document.getElementById("cTaxId").value=c?c.taxId:"";
  document.getElementById("custModal").classList.add("open");
}
function closeCustModal(){document.getElementById("custModal").classList.remove("open");editingCustId=null;}
function saveCustomer(){
  const name=document.getElementById("cName").value.trim();
  if(!name){showAlert("الرجاء كتابة اسم العميل","error");return;}
  const phone=document.getElementById("cPhone").value.trim();
  const location=document.getElementById("cLocation").value.trim();
  const taxId=document.getElementById("cTaxId").value.trim();
  if(editingCustId){
    S.customers=S.customers.map(c=>c.id===editingCustId?{...c,name,phone,location,taxId}:c);
    showAlert("تم تحديث بيانات العميل ✅");
  } else {
    S.customers.push({id:Date.now().toString(),name,phone,location,taxId,purchases:[]});
    showAlert("تمت إضافة العميل ✅");
  }
  closeCustModal();save();render();
}
function deleteCustomer(id){if(!confirm("حذف هذا العميل؟ سجل مشترياته سيبقى محفوظاً في السجل العام"))return;S.customers=S.customers.filter(c=>c.id!==id);save();render();showAlert("تم الحذف","error");}
let viewingCustId=null;
function viewCustomer(id){viewingCustId=id;render();}

function addTask(){
  const name=document.getElementById("tName").value.trim();
  const days=parseInt(document.getElementById("tDays").value);
  const last=document.getElementById("tLast").value;
  if(!name){showAlert("الرجاء كتابة اسم المهمة","error");return;}
  S.tasks.push({id:Date.now().toString(),name,intervalDays:days,lastDone:last||""});
  save();render();showAlert("تمت الإضافة ✅");
}
function markDone(id){S.tasks=S.tasks.map(t=>t.id===id?{...t,lastDone:new Date().toISOString().split("T")[0]}:t);save();render();showAlert("تم تسجيل الإنجاز ✅");}
function deleteTask(id){S.tasks=S.tasks.filter(t=>t.id!==id);save();render();showAlert("تم الحذف","error");}

function migrateOldEntries(){
  // دمج السجلات المؤرشفة يدوياً قديماً (إن وجدت) ضمن نفس قائمة السجل، مع تعيين سنة افتراضية
  if(S.archivedHistory&&Object.keys(S.archivedHistory).length){
    Object.entries(S.archivedHistory).forEach(([yr,list])=>{
      list.forEach(e=>{if(!e.year)e.year=parseInt(yr);S.history.push(e);});
    });
    S.archivedHistory={};
  }
  // أي سجل قديم بدون حقل year ياخذ سنة تاريخه أو السنة الحالية كحل أخير
  S.history.forEach(e=>{if(!e.year)e.year=new Date().getFullYear();});
  S.sales.forEach(e=>{if(!e.year)e.year=new Date().getFullYear();});
}

function render(){
  const c=document.getElementById("mainContent");
  if(!c)return;
  const fns={inventory:rInv,addMaterial:rAdd,savedFormulas:rSaved,approvedFormulas:rApproved,history:rHistory,maintenance:rMaint,sales:rSales,customers:rCustomers};
  const fn=fns[currentView]||rInv;
  c.innerHTML="";
  fn(c);
  updateWarnings();
}

function el(tag,attrs,text){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==="style")e.style.cssText=v;else if(k==="class")e.className=v;else e.setAttribute(k,v);});
  if(text!=null)e.textContent=text;
  return e;
}

    top.innerHTML='<span style="font-weight:700;font-size:15px">💵 '+esc(s.materialName)+'</span><span style="font-size:12px;color:#64748b">'+esc(s.date)+'</span>';
    cd.appendChild(top);
    const body=div("","font-size:13px;color:#94a3b8;line-height:1.8");
    let html='<div>الكمية: '+s.qty+' '+esc(s.unit)+'</div>';
    if(s.customerName)html+='<div>👤 العميل: '+esc(s.customerName)+'</div>';
    if(s.cost)html+='<div>التكلفة: '+s.cost.toFixed(2)+' ريال</div>';
    if(s.salePrice)html+='<div>سعر البيع: '+s.salePrice.toFixed(2)+' ريال</div>';
    body.innerHTML=html;
    cd.appendChild(body);
    if(s.profit!=null){
      const pb2=div("price-box","margin-top:8px;border-color:"+(s.profit>=0?"rgba(34,197,94,0.4)":"rgba(239,68,68,0.4)"));
      pb2.innerHTML='<span class="price-label">'+(s.profit>=0?'📈 الربح':'📉 الخسارة')+'</span><span class="price-total" style="color:'+(s.profit>=0?'#4ade80':'#f87171')+'">'+Math.abs(s.profit).toFixed(2)+' ريال</span>';
      cd.appendChild(pb2);
    }
    const delBtn=el("button",{class:"btn-danger",style:"margin-top:8px;width:100%"},"🗑️ حذف");
    delBtn.onclick=()=>deleteSale(s.id);
    cd.appendChild(delBtn);
    c.appendChild(cd);
  });
}

function rCustomers(c){
  if(viewingCustId){
    const cust=S.customers.find(c=>c.id===viewingCustId);
    if(!cust){viewingCustId=null;}
    else{
      const top=div("section-title");
      const h=el("h2",{style:"margin:0"},"👤 "+cust.name);
      const backBtn=el("button",{class:"btn btn-ghost",style:"width:auto"},"⬅️ رجوع");
      backBtn.onclick=()=>{viewingCustId=null;render();};
      top.appendChild(h);top.appendChild(backBtn);
      c.appendChild(top);

      const infoCard=card();
      let infoHtml="";
      if(cust.phone)infoHtml+='<div style="margin-bottom:6px">📞 '+esc(cust.phone)+'</div>';
      if(cust.location)infoHtml+='<div style="margin-bottom:6px">📍 '+esc(cust.location)+'</div>';
      if(cust.taxId)infoHtml+='<div style="margin-bottom:6px">🧾 الرقم الضريبي: '+esc(cust.taxId)+'</div>';
      infoCard.innerHTML=infoHtml||'<div style="color:#64748b">لا توجد بيانات إضافية</div>';
      c.appendChild(infoCard);

      const purchases=cust.purchases||[];
      let totalProfit=0,totalSales=0;
      purchases.forEach(p=>{if(p.profit!=null)totalProfit+=p.profit;if(p.salePrice)totalSales+=p.salePrice;});
      if(totalSales>0){
        const sumCard=div("price-box","margin-bottom:14px");
        sumCard.innerHTML='<span class="price-label">💰 إجمالي مشترياته</span><span class="price-total">'+totalSales.toFixed(2)+' ريال</span>';
        c.appendChild(sumCard);
        if(totalProfit){
          const profCard=div("price-box","margin-bottom:14px;border-color:"+(totalProfit>=0?"rgba(34,197,94,0.4)":"rgba(239,68,68,0.4)"));
          profCard.innerHTML='<span class="price-label">'+(totalProfit>=0?'📈 صافي الربح منه':'📉 صافي الخسارة')+'</span><span class="price-total" style="color:'+(totalProfit>=0?'#4ade80':'#f87171')+'">'+Math.abs(totalProfit).toFixed(2)+' ريال</span>';
          c.appendChild(profCard);
        }
      }

      const h3=el("h2",{style:"font-size:16px;margin-bottom:10px"},"📜 سجل المشتريات");
      c.appendChild(h3);
      if(!purchases.length){
        const empty=div("empty");empty.innerHTML='<div style="font-size:40px;margin-bottom:10px">📜</div><div>لا يوجد مشتريات بعد</div>';
        c.appendChild(empty);return;
      }
      purchases.forEach(p=>{
        const cd=card();
        const top=div("","display:flex;justify-content:space-between;margin-bottom:6px");
        top.innerHTML='<span style="font-weight:700;font-size:14px">'+(p.type==="formula"?"🧪":"💵")+' '+esc(p.name)+'</span><span style="font-size:12px;color:#64748b">'+esc(p.date)+'</span>';
        cd.appendChild(top);
        if(p.salePrice){
          const pr=div("","font-size:13px;color:#94a3b8");
          pr.innerHTML='سعر البيع: '+p.salePrice.toFixed(2)+' ريال'+(p.profit!=null?' · <span style="color:'+(p.profit>=0?'#4ade80':'#f87171')+'">'+(p.profit>=0?'ربح':'خسارة')+': '+Math.abs(p.profit).toFixed(2)+' ريال</span>':'');
          cd.appendChild(pr);
        }
        c.appendChild(cd);
      });
      return;
    }
  }

  const top=div("section-title");
  const h=el("h2",{style:"margin:0"},"👤 العملاء");
  const addBtn=el("button",{class:"btn",style:"width:auto;padding:8px 16px;font-size:13px"},"➕ عميل جديد");
  addBtn.onclick=()=>openCustModal();
  top.appendChild(h);top.appendChild(addBtn);
  c.appendChild(top);

  if(!S.customers.length){
    const empty=div("empty");empty.innerHTML='<div style="font-size:40px;margin-bottom:10px">👤</div><div>لا يوجد عملاء بعد</div><div style="font-size:13px;margin-top:6px">اضغط "عميل جديد" لإضافة أول عميل</div>';
    c.appendChild(empty);return;
  }
  S.customers.forEach(cust=>{
    const cd=card();
    const top2=div("","display:flex;justify-content:space-between;align-items:center;margin-bottom:10px");
    const info=div();
    let sub="";
    if(cust.phone)sub+=cust.phone;
    if(cust.location)sub+=(sub?" · ":"")+cust.location;
    info.innerHTML='<div style="font-weight:700;font-size:15px">'+esc(cust.name)+'</div>'+(sub?'<div style="font-size:12px;color:#94a3b8">'+esc(sub)+'</div>':'');
    const purchCount=(cust.purchases||[]).length;
    const badge=el("span",{style:"font-size:12px;color:#a5b4fc;background:rgba(99,102,241,0.15);padding:3px 10px;border-radius:20px"},purchCount+" عملية شراء");
    top2.appendChild(info);top2.appendChild(badge);
    cd.appendChild(top2);
    const btnRow=div("row");
    const viewBtn=el("button",{class:"btn-blue",style:"flex:2"},"📜 سجل المشتريات");
    viewBtn.onclick=()=>viewCustomer(cust.id);
    const editBtn=el("button",{class:"btn btn-ghost",style:"flex:1"},"✏️");
    editBtn.onclick=()=>openCustModal(cust.id);
    const delBtn=el("button",{class:"btn-danger"},"🗑️");
    delBtn.onclick=()=>deleteCustomer(cust.id);
    btnRow.appendChild(viewBtn);btnRow.appendChild(editBtn);btnRow.appendChild(delBtn);
    cd.appendChild(btnRow);
    c.appendChild(cd);
  });
}

load();render();

</script>
</body>
</html>
