<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="sct-manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عاصفة الكيمياء">
<title>مؤسسة عاصفة الكيمياء</title>
<style>
:root{--bg:#0B1220;--sf:#131C2E;--sf2:#1A2540;--bd:#26324D;--tx:#E6EBF5;--mu:#8A97AD;--ac:#F97316;--ac2:#EA580C;--gr:#22C55E;--rd:#EF4444;--am:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;font-size:13px;direction:rtl;color:var(--tx);padding-bottom:24px}
input,select,button,textarea{font-family:inherit;direction:rtl;color:var(--tx);font-size:13px}
input::placeholder,textarea::placeholder{color:#5D6B85}
.header{background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:100}
.logo-wrap{display:flex;align-items:center;gap:8px}
.logo-img{height:34px;width:34px;border-radius:8px;object-fit:cover}
.company-name{font-weight:700;font-size:13px}.company-sub{font-size:10px;color:var(--mu)}
.header-btns{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.btn-export,.btn-import-label{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11px;font-weight:600;display:inline-block}
.warn{border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600}
.warn-stock{background:rgba(245,158,11,.15);border:1px solid var(--am);color:#FBBF24}
.warn-overdue{background:rgba(239,68,68,.15);border:1px solid var(--rd);color:#F87171;cursor:pointer}
.nav{display:flex;gap:4px;padding:6px 12px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--bd);position:sticky;top:51px;z-index:90;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex:0 0 auto;padding:7px 12px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--mu);white-space:nowrap}
.nav-btn.active{background:var(--ac);color:#fff}
.content{padding:10px 12px;max-width:820px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card-green{border-color:rgba(34,197,94,.4)}
.card-edit{border-color:var(--ac)!important}
.inp{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px;outline:none}
.inp:focus{border-color:var(--ac)}
.inp option{background:#1A2540}
label.lbl{display:block;margin-bottom:3px;font-size:11px;color:var(--mu)}
.btn{padding:9px 14px;border-radius:7px;border:none;background:var(--ac);color:#fff;font-size:13px;font-weight:700;cursor:pointer;width:100%}
.btn:active{background:var(--ac2)}
.btn-green{background:#16A34A}
.btn-ghost{background:var(--sf2);color:var(--mu);border:1px solid var(--bd)}
.btn-blue{background:var(--sf2);color:#9DB4FF;border:1px solid var(--bd);border-radius:7px;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:700}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#F87171;border-radius:7px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600}
.sb{flex:1;padding:6px 4px;border-radius:6px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.sb.p{background:var(--ac);border-color:var(--ac);color:#fff}.sb.d{color:#F87171;flex:0 0 36px}
.chip{flex:0 0 auto;padding:5px 10px;border-radius:14px;border:1px solid var(--bd);background:transparent;color:var(--mu);font-size:11.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--sf2);border-color:var(--ac);color:var(--ac)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600}
.t-mix{background:rgba(56,189,248,.12);color:#38BDF8}.t-sale{background:rgba(249,115,22,.14);color:#FB923C}
.t-red{background:rgba(239,68,68,.15);color:#F87171}.t-am{background:rgba(245,158,11,.15);color:#FBBF24}.t-gy{background:rgba(148,163,184,.12);color:var(--mu)}
.row{display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.empty{text-align:center;padding:30px 16px;background:var(--sf);border-radius:10px;color:var(--mu)}
.price-box{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:7px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center}
.price-total{font-size:14px;font-weight:700;color:#FBBF24}.price-label{font-size:12px;color:var(--mu)}
.alert-box{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;color:#fff;padding:9px 18px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.4);font-weight:600;font-size:13px;display:none;max-width:92vw;text-align:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:998;display:none;align-items:center;justify-content:center;padding:14px}
.modal-overlay.open{display:flex}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto}
h2{font-size:16px;font-weight:700;margin-bottom:8px}
.status-badge{border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rpd{font-size:11px;color:#FBBF24;margin-top:2px}
.logbox{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:8px;max-height:200px;overflow-y:auto;font-size:11.5px}
.logbox .li{padding:5px 0;border-top:1px solid var(--bd);color:var(--mu)}.logbox .li:first-child{border-top:none}
</style>
</head>
<body>
<div class="alert-box" id="alertBox"></div>
<div class="modal-overlay" id="applyModal">
  <div class="modal">
    <h3 style="margin-bottom:4px">🧪 تطبيق خلطة</h3>
    <p id="applyModalName" style="color:#94a3b8;font-size:14px;margin-bottom:14px"></p>
    <label class="lbl">كم مرة تريد تطبيق الخلطة؟</label>
    <input type="number" min="1" value="1" id="applyQtyInput" class="inp" style="text-align:center;font-size:18px;margin-bottom:6px" oninput="updateApplyPreview()">
    <div style="font-size:12px;color:#64748b;text-align:center;margin-bottom:12px">مثال: 1 = دفعة واحدة</div>
    <div id="applyModalItems" style="background:rgba(255,255,255,0.04);border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px;color:#94a3b8"></div>
    <div id="applyTotalPrice"></div>
    <label class="lbl" style="margin-top:10px">العميل (اختياري)</label>
    <select id="applyCustomer" class="inp" style="margin-bottom:10px"><option value="">بدون عميل</option></select>
    <label class="lbl">سعر البيع للزبون (ريال، اختياري)</label>
    <input type="number" id="applySalePrice" class="inp" placeholder="مثال: 500" style="margin-bottom:6px" oninput="updateApplyPreview()">
    <div id="applyProfitBox"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeApplyModal()">إلغاء</button>
      <button class="btn" style="flex:2" onclick="confirmApply()">✅ تأكيد الخصم</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="saleModal">
  <div class="modal">
    <h3 style="margin-bottom:4px">💵 بيع مادة خام</h3>
    <p id="saleModalName" style="color:#94a3b8;font-size:14px;margin-bottom:14px"></p>
    <label class="lbl">الكمية المباعة</label>
    <input type="number" id="saleQtyInput" class="inp" style="margin-bottom:10px" oninput="updateSalePreview()">
    <label class="lbl">العميل (اختياري)</label>
    <select id="saleCustomer" class="inp" style="margin-bottom:10px"><option value="">بدون عميل</option></select>
    <label class="lbl">ملاحظات البيع (اختياري)</label>
    <textarea id="saleNote" class="inp" rows="2" placeholder="مثال: رقم الفاتورة، المشروع، طريقة الدفع" style="margin-bottom:10px"></textarea>
    <label class="lbl">سعر البيع الإجمالي (ريال، اختياري)</label>
    <input type="number" id="saleSalePrice" class="inp" placeholder="مثال: 200" style="margin-bottom:8px" oninput="updateSalePreview()">
    <div id="saleProfitBox"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeSaleModal()">إلغاء</button>
      <button class="btn" style="flex:2" onclick="confirmSale()">✅ تأكيد البيع</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="custModal">
  <div class="modal">
    <h3 style="margin-bottom:14px" id="custModalTitle">👤 عميل جديد</h3>
    <label class="lbl">اسم العميل</label><input id="cName" class="inp" style="margin-bottom:10px">
    <label class="lbl">رقم الهاتف</label><input id="cPhone" class="inp" style="margin-bottom:10px">
    <label class="lbl">الموقع</label><input id="cLocation" class="inp" style="margin-bottom:10px">
    <label class="lbl">الرقم الضريبي</label><input id="cTaxId" class="inp" style="margin-bottom:10px">
    <label class="lbl">ملفات العميل (مثل العنوان الوطني، صورة أو PDF)</label>
    <div class="btn btn-ghost" style="position:relative;text-align:center;margin-bottom:4px;overflow:hidden">📎 إرفاق ملف<input type="file" multiple accept="image/*,application/pdf,.pdf" onchange="addFiles('cust',this)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px"></div>
    <div id="cFileList" style="margin-bottom:12px"></div>
    <div class="row">
      <button class="btn btn-ghost" style="flex:1" onclick="cancelCust()">إلغاء</button>
      <button class="btn" style="flex:2" onclick="saveCustomer()">💾 حفظ</button>
    </div>
  </div>
</div>

  <div class="logo-wrap">

<script>

const SK="paint_factory_v2";
let S={materials:[],history:[],savedFormulas:[],approvedFormulas:[],tasks:[],archivedHistory:{},customers:[],sales:[]};
let currentView="inventory",applyingId=null,editingMatId=null,editingFormulaId=null;

function save(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){showAlert("تعذّر حفظ البيانات على هذا الجهاز! صدّر نسخة احتياطية الآن","error");}updateWarnings();}
function load(){try{const s=localStorage.getItem(SK);if(s){const p=JSON.parse(s);S={materials:p.materials||[],history:p.history||[],savedFormulas:p.savedFormulas||[],approvedFormulas:p.approvedFormulas||[],tasks:p.tasks||[],archivedHistory:p.archivedHistory||{},customers:p.customers||[],sales:p.sales||[]};migrateOldEntries();}}catch(e){}}

let aT;
function showAlert(msg,type){const el=document.getElementById("alertBox");el.textContent=msg;el.style.background=type==="error"?"#ef4444":"#22c55e";el.style.display="block";clearTimeout(aT);aT=setTimeout(()=>el.style.display="none",3000);}

function updateWarnings(){
  const low=S.materials.filter(isLow);
  const ex=S.materials.filter(m=>{const d=daysToExp(m);return d!==null&&d<=60;});
  const ew=document.getElementById("expWarn");
  if(ew){ew.style.display=ex.length?"":"none";ew.textContent="⏳ "+ex.length+" صلاحية";}
  const lw=document.getElementById("lowStockWarn");
  if(lw){lw.style.display=low.length?"":"none";lw.textContent="⚠️ "+low.length+" مواد منخفضة";}
  const ov=S.tasks.filter(t=>{const d=getDaysLeft(t);return d!==null&&d<0;});
  const ow=document.getElementById("overdueWarn");
  if(ow){ow.style.display=ov.length?"":"none";ow.textContent="🔧 "+ov.length+" مهام متأخرة";}
}

function showView(v){
  currentView=v;editingMatId=null;editingFormulaId=null;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  const t=document.getElementById("tab-"+v);if(t){t.classList.add("active");if(t.scrollIntoView)t.scrollIntoView({inline:"center",block:"nearest"});}
  render();
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const UNITS=["كغ","غ","لتر","مل","طن","برميل","طبلية","حبة","كيس 20 كغ","كيس 25 كغ","كيس 50 كغ","برميل 50 لتر","برميل 100 لتر","برميل 200 لتر"];
function unitOpts(sel){const l=UNITS.includes(sel)||!sel?UNITS:[sel].concat(UNITS);return l.map(u=>'<option'+(u===sel?' selected':'')+'>'+esc(u)+'</option>').join("");}
function matOpts(sel){return '<option value="">اختر المادة</option>'+S.materials.filter(m=>m.category!=="sale"||m.id===sel).map(m=>'<option value="'+m.id+'"'+(m.id===sel?' selected':'')+'>'+esc(m.name)+' ('+m.quantity+' '+esc(m.unit)+')</option>').join("");}
function isLow(m){const t=m.min>0?m.min:10;return m.quantity<t;}
function daysToExp(m){if(!m.expiry)return null;const d=new Date(m.expiry+"T00:00:00");if(isNaN(d))return null;const n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/864e5);}
function expTag(m){const d=daysToExp(m);if(d===null)return "";if(d<0)return '<span class="tag t-red">منتهية منذ '+(-d)+' يوم</span>';if(d<=60)return '<span class="tag t-am">تنتهي بعد '+d+' يوم</span>';return '<span class="tag t-gy">صلاحية '+m.expiry.split("-").reverse().join("/")+'</span>';}
function getStockColor(m){return m.quantity<=0?"#ef4444":isLow(m)?"#f59e0b":"#22c55e";}
function getDaysLeft(t){if(!t.lastDone)return null;const n=new Date(t.lastDone+"T00:00:00");if(isNaN(n))return null;n.setDate(n.getDate()+t.intervalDays);const now=new Date();now.setHours(0,0,0,0);return Math.round((n-now)/864e5);}
function getTaskColor(d){return d===null?"#94a3b8":d<0?"#ef4444":d<=3?"#f59e0b":"#22c55e";}
function getTaskStatus(d){return d===null?"لم تُنجز بعد":d<0?"متأخر "+Math.abs(d)+" يوم":d===0?"اليوم!":"بعد "+d+" يوم";}
function iLabel(d){return({1:"كل يوم",7:"كل أسبوع",14:"كل أسبوعين",30:"كل شهر",60:"كل شهرين",90:"كل 3 أشهر",180:"كل 6 أشهر",365:"كل سنة"})[d]||"كل "+d+" يوم";}
function fTotal(rows){return rows.reduce((s,r)=>{const m=S.materials.find(m=>m.id===r.materialId);return m&&m.pricePerUnit&&r.amount?s+m.pricePerUnit*parseFloat(r.amount):s;},0);}

async function exportData(){
  const fileData={};
  try{for(const c of S.customers.concat(S.materials))for(const f of (c.files||[])){const b=await getFile(f.id);if(b)fileData[f.id]=await toDataUrl(b);}}catch(e){}
  const blob=new Blob([JSON.stringify({...S,fileData,exportedAt:new Date().toLocaleString("ar-SA")},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="عاصفة-الكيمياء-"+new Date().toISOString().split("T")[0]+".json";a.click();
  showAlert("تم تصدير البيانات ✅");
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      if(!Array.isArray(p.materials)){showAlert("ملف غير صحيح","error");return;}
      if(!confirm("سيتم استبدال كل البيانات الحالية ببيانات الملف. هل تريد المتابعة؟"))return;
      S={materials:p.materials||[],history:p.history||[],savedFormulas:p.savedFormulas||[],approvedFormulas:p.approvedFormulas||[],tasks:p.tasks||[],archivedHistory:p.archivedHistory||{},customers:p.customers||[],sales:p.sales||[]};
      if(p.fileData){for(const id in p.fileData){try{const b=await (await fetch(p.fileData[id])).blob();await putFile(id,b);}catch(e){}}}
      migrateOldEntries();save();render();showAlert("تم الاستيراد ✅");
    }catch{showAlert("خطأ في الملف","error");}
  };
  r.readAsText(f);e.target.value="";
}

function updateFTotal(){

  if(tb){tb.style.display=total>0?"flex":"none";const sp=tb.querySelector(".price-total");if(sp)sp.textContent=total.toFixed(2)+" ريال";}

function updateApplyPreview(){
  const f=S.approvedFormulas.find(f=>f.id===applyingId);if(!f)return;
  const qty=parseFloat(document.getElementById("applyQtyInput").value)||1;
  let html="",total=0;
  f.rows.forEach((row,i)=>{
    const m=S.materials.find(m=>m.id===row.materialId);
    const amt=(parseFloat(row.amount)*qty).toFixed(2);
    const rp=m&&m.pricePerUnit?(m.pricePerUnit*parseFloat(amt)).toFixed(2):null;
    if(rp)total+=parseFloat(rp);
    html+='<div style="display:flex;justify-content:space-between;padding:3px 0'+(i>0?';border-top:1px solid rgba(255,255,255,0.05)':'')+'"><span>'+(m?m.name:'؟')+'</span><div><span style="color:#f87171">- '+amt+' '+(m?m.unit:'')+'</span>'+(rp?'<span style="color:#fbbf24;margin-right:8px">'+rp+' ر</span>':'')+'</div></div>';
  });
  document.getElementById("applyModalItems").innerHTML=html;
  const tb=document.getElementById("applyTotalPrice");
  tb.innerHTML=total>0?'<div class="price-box"><span class="price-label">💰 إجمالي التكلفة</span><span class="price-total">'+total.toFixed(2)+' ريال</span></div>':'';
  const salePrice=parseFloat(document.getElementById("applySalePrice").value);
  const pb=document.getElementById("applyProfitBox");
  if(!isNaN(salePrice)&&salePrice>0){

  } else pb.innerHTML="";
}
function confirmApply(){
  const f=S.approvedFormulas.find(f=>f.id===applyingId);
  const qty=parseFloat(document.getElementById("applyQtyInput").value);
  if(!f||isNaN(qty)||qty<=0){showAlert("كمية غير صحيحة","error");return;}
  const need={};
  for(const row of f.rows){
    const m=S.materials.find(m=>m.id===row.materialId);
    if(!m){showAlert("مادة غير موجودة","error");return;}
    need[m.id]=(need[m.id]||0)+parseFloat(row.amount)*qty;
  }
  const updates=[];
  let cost=0;
  for(const id in need){
    const m=S.materials.find(m=>m.id===id);
    const amt=+need[id].toFixed(3);
    if(m.quantity<amt){showAlert("المخزون غير كافٍ لـ "+m.name,"error");return;}
    updates.push({id:m.id,name:m.name,unit:m.unit,used:amt});
    if(m.pricePerUnit)cost+=m.pricePerUnit*amt;
  }
  S.materials=S.materials.map(m=>{const u=updates.find(u=>u.id===m.id);return u?{...m,quantity:+(m.quantity-u.used).toFixed(3)}:m;});
  const custId=document.getElementById("applyCustomer").value;
  const cust=S.customers.find(c=>c.id===custId);
  const salePrice=parseFloat(document.getElementById("applySalePrice").value)||0;
  const entry={id:Date.now(),date:new Date().toLocaleString("ar-SA"),year:new Date().getFullYear(),name:f.name+(qty>1?" (×"+qty+")":""),items:updates.map(u=>({name:u.name,used:u.used,unit:u.unit})),customerId:custId||null,customerName:cust?cust.name:null,cost:+cost.toFixed(2),salePrice:salePrice,profit:salePrice?+(salePrice-cost).toFixed(2):null};
  S.history.unshift(entry);
  if(cust){if(!cust.purchases)cust.purchases=[];cust.purchases.unshift({type:"formula",date:entry.date,name:entry.name,cost:entry.cost,salePrice:entry.salePrice,profit:entry.profit});}
  closeApplyModal();save();showView("inventory");showAlert("تم تطبيق "+f.name+" ✅");
}

let editingCustId=null;
const FC={cust:{tmp:[],added:[],removed:[],box:"cFileList"},mat:{tmp:[],added:[],removed:[],box:"mFileList"}};
function idb(){return new Promise((res,rej)=>{if(!window.indexedDB){rej(new Error("no idb"));return;}const r=indexedDB.open("sct_files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbPut(id,b){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(b,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbGet(id){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction("f").objectStore("f").get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbDel(id){try{const d=await idb();d.transaction("f","readwrite").objectStore("f").delete(id);}catch(e){}}
function toDataUrl(b){return new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(b);});}
async function putFile(id,b){try{await idbPut(id,b);}catch(e){if(b.size>1500000)throw e;localStorage.setItem("sctf_"+id,await toDataUrl(b));}}
async function getFile(id){try{const b=await idbGet(id);if(b)return b;}catch(e){}const u=localStorage.getItem("sctf_"+id);return u?await (await fetch(u)).blob():null;}
function delFile(id){idbDel(id);try{localStorage.removeItem("sctf_"+id);}catch(e){}}
function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";}
function attachHtml(k){return '<div class="btn btn-ghost" style="position:relative;text-align:center;margin-bottom:4px;overflow:hidden">📎 إرفاق ملف (PDF أو صورة)<input type="file" multiple accept="image/*,application/pdf,.pdf" onchange="addFiles(\''+k+'\',this)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px"></div>';}
function renderFiles(k){
  const box=document.getElementById(FC[k].box);if(!box)return;box.innerHTML="";
  FC[k].tmp.forEach(f=>{
    const r=div("row","padding:5px 0;border-top:1px solid #26324D;font-size:12px");
    r.appendChild(el("span",{style:"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},"📎 "+f.name+" ("+fmtSize(f.size)+")"));
    const x=el("button",{class:"sb d"},"✕");
    x.onclick=()=>{const st=FC[k];st.tmp=st.tmp.filter(t=>t.id!==f.id);if(st.added.includes(f.id)){st.added=st.added.filter(i=>i!==f.id);delFile(f.id);}else st.removed.push(f.id);renderFiles(k);};
    const ob=el("button",{class:"sb p",style:"flex:0 0 56px"},"فتح");ob.onclick=()=>openFile(f.id,f.name,f.type);
    r.appendChild(ob);r.appendChild(x);box.appendChild(r);
  });
}
async function addFiles(k,inp){
  const fs=[...inp.files];inp.value="";
  if(!fs.length)return;
  for(const f of fs){
    if(f.size>10*1048576){showAlert("الملف أكبر من 10 ميغابايت: "+f.name,"error");continue;}
    try{const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await putFile(id,f);FC[k].tmp.push({id,name:f.name,type:f.type,size:f.size});FC[k].added.push(id);}
    catch(e){showAlert("تعذّر حفظ الملف على هذا الجهاز: "+f.name,"error");}
  }
  renderFiles(k);
}
function addCustFiles(inp){return addFiles("cust",inp);}
function finishFiles(k){FC[k].removed.forEach(delFile);FC[k].added=[];FC[k].removed=[];}
function abortFiles(k){FC[k].added.forEach(delFile);FC[k].added=[];FC[k].removed=[];}
async function openFile(id,name,type){
  try{
    const b=await getFile(id);
    if(!b){showAlert("الملف غير موجود على هذا الجهاز","error");return;}
    const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.rel="noopener";
    const isPdf=(type||b.type||"").includes("pdf")||/\.pdf$/i.test(name||"");
    if(isPdf){a.download=name||"file.pdf";showAlert("جاري تنزيل الملف... افتحه من الإشعارات أو التنزيلات");}
    else a.target="_blank";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),60000);
  }catch(e){showAlert("تعذّر فتح الملف","error");}
}
function cancelCust(){abortFiles("cust");closeCustModal();}
function openCustModal(id){
  editingCustId=id||null;
  const c=id?S.customers.find(c=>c.id===id):null;
  document.getElementById("custModalTitle").textContent=id?"✏️ تعديل عميل":"👤 عميل جديد";

function migrateOldEntries(){
  // دمج السجلات المؤرشفة يدوياً قديماً (إن وجدت) ضمن نفس قائمة السجل، مع تعيين سنة افتراضية
  if(S.archivedHistory&&Object.keys(S.archivedHistory).length){
    Object.entries(S.archivedHistory).forEach(([yr,list])=>{
      list.forEach(e=>{if(!e.year)e.year=parseInt(yr);S.history.push(e);});
    });
    S.archivedHistory={};
  }
  // أي سجل قديم بدون حقل year ياخذ سنة تاريخه أو السنة الحالية كحل أخير
  S.history.forEach(e=>{if(!e.year)e.year=new Date().getFullYear();});
  S.sales.forEach(e=>{if(!e.year)e.year=new Date().getFullYear();});
}

  const list=S.history.filter(e=>(e.year||new Date().getFullYear())===viewingHistoryYear);
  if(!list.length){
    const empty=div("empty");empty.innerHTML='<div style="font-size:40px;margin-bottom:10px">📋</div><div>لا يوجد سجلات بعد</div>';
    c.appendChild(empty);return;
  }
  list.forEach(e=>{
    const cd=card();cd.style.padding="0";
    const head=div("row","padding:10px 12px;cursor:pointer;gap:8px");
    const info=div("","flex:1;min-width:0");
    info.innerHTML='<div style="font-weight:700;font-size:14px">🧪 '+esc(e.name)+'</div><div style="font-size:11px;color:#8A97AD;margin-top:2px">'+esc(e.date)+' · 👤 '+esc(custNameOf(e)||'بدون عميل')+' · '+e.items.length+' مواد</div>';
    const chev=el("span",{style:"color:#8A97AD;font-size:12px"},expandedHist.has(e.id)?"▲":"▼");
    const del=el("button",{class:"sb d"},"🗑️");
    del.onclick=ev=>{ev.stopPropagation();deleteHistory(e.id);};
    head.appendChild(info);head.appendChild(chev);head.appendChild(del);
    cd.appendChild(head);
    const body=div("","padding:0 12px 10px;border-top:1px solid #26324D;display:"+(expandedHist.has(e.id)?"block":"none"));
    e.items.forEach((item,i)=>{
      const rd=div("","display:flex;justify-content:space-between;font-size:13px;color:#94a3b8;padding:4px 0"+(i>0?";border-top:1px solid rgba(255,255,255,0.05)":""));
      rd.innerHTML='<span>'+esc(item.name)+'</span><span style="color:#f87171">- '+item.used+' '+esc(item.unit)+'</span>';
      body.appendChild(rd);
    });
    if(e.profit!=null){
      const pb=div("price-box","margin-top:8px;border-color:"+(e.profit>=0?"rgba(34,197,94,0.4)":"rgba(239,68,68,0.4)"));
      pb.innerHTML='<span class="price-label">'+(e.profit>=0?'📈 الربح':'📉 الخسارة')+'</span><span class="price-total" style="color:'+(e.profit>=0?'#4ade80':'#f87171')+'">'+Math.abs(e.profit).toFixed(2)+' ريال</span>';
      body.appendChild(pb);
    }
    cd.appendChild(body);
    head.onclick=()=>{const o=body.style.display==="none";body.style.display=o?"block":"none";chev.textContent=o?"▲":"▼";if(o)expandedHist.add(e.id);else expandedHist.delete(e.id);};
    c.appendChild(cd);
  });
}
const expandedHist=new Set();
function deleteHistory(id){
  const e=S.history.find(h=>h.id===id);if(!e)return;
  if(!confirm("حذف هذا السجل نهائياً؟"))return;
  const restore=confirm("هل تريد إرجاع الكميات المخصومة إلى المخزون؟\n\nموافق = إرجاع الكميات\nإلغاء = حذف السجل فقط");
  if(restore){e.items.forEach(it=>{const m=S.materials.find(m=>m.name===it.name&&m.unit===it.unit);if(m)m.quantity=+(m.quantity+it.used).toFixed(3);});}
  S.history=S.history.filter(h=>h.id!==id);
  const cu=e.customerId&&S.customers.find(c=>c.id===e.customerId);
  if(cu&&cu.purchases)cu.purchases=cu.purchases.filter(p=>!(p.type==="formula"&&p.date===e.date&&p.name===e.name));
  expandedHist.delete(id);save();render();showAlert(restore?"تم الحذف وإرجاع الكميات":"تم حذف السجل","error");
}

function rMaint(c){
  const h=el("h2",{},"🔧 مواعيد الصيانة الدورية");c.appendChild(h);
  const sub=el("p",{style:"color:#64748b;font-size:13px;margin-bottom:14px"},"تتبع مواعيد صيانة المعدات");c.appendChild(sub);
  const addCard=card();
  addCard.style.marginBottom="14px";
  const iOpts=[1,3,7,14,30,60,90,180,365].map(v=>'<option value="'+v+'"'+(v===14?' selected':'')+'>'+iLabel(v)+'</option>').join('');
  addCard.innerHTML='<div style="font-weight:600;margin-bottom:10px">➕ إضافة موعد جديد</div>'+
    '<label class="lbl">اسم المهمة / المعدة</label><input id="tName" class="inp" placeholder="مثال: تشحيم الخلاطة" style="margin-bottom:10px">'+
    '<div class="grid2" style="margin-bottom:10px">'+
    '<div><label class="lbl">كل كم يوم؟</label><select id="tDays" class="inp">'+iOpts+'</select></div>'+
    '<div><label class="lbl">آخر مرة تمت</label><input type="date" id="tLast" class="inp" style="color-scheme:dark"></div></div>'+
    '<button class="btn" onclick="addTask()">➕ إضافة الموعد</button>';
  c.appendChild(addCard);
  if(!S.tasks.length){
    const empty=div("empty");empty.innerHTML='<div style="font-size:40px;margin-bottom:10px">🔧</div><div>لا يوجد مواعيد بعد</div>';
    c.appendChild(empty);return;
  }
  [...S.tasks].sort((a,b)=>(getDaysLeft(a)??9999)-(getDaysLeft(b)??9999)).forEach(t=>{
    const d=getDaysLeft(t);const col=getTaskColor(d);const st=getTaskStatus(d);
    const cd=card();cd.style.borderColor=col+"40";
    const top=div("","display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px");
    const last=t.lastDone?" · آخر مرة: "+new Date(t.lastDone).toLocaleDateString("ar-SA"):"";
    top.innerHTML='<div><div style="font-weight:700;font-size:15px">🔧 '+esc(t.name)+'</div><div style="font-size:12px;color:#64748b;margin-top:3px">'+iLabel(t.intervalDays)+last+'</div></div>'+
      '<div class="status-badge" style="color:'+col+';background:'+col+'20;border:1px solid '+col+'60">'+st+'</div>';
    cd.appendChild(top);
    const btnRow=div("row");
    const doneBtn=el("button",{class:"btn btn-green",style:"flex:3;font-size:13px"},"✅ تم الإنجاز اليوم");doneBtn.onclick=()=>markDone(t.id);
    const delBtn=el("button",{class:"btn-danger"},"🗑️");delBtn.onclick=()=>deleteTask(t.id);
    btnRow.appendChild(doneBtn);btnRow.appendChild(delBtn);
    cd.appendChild(btnRow);c.appendChild(cd);
  });
}

let viewingSalesYear=null;

function rSales(c){
  const years=[...new Set(S.sales.map(s=>s.year||new Date().getFullYear()))].sort((a,b)=>b-a);
  if(viewingSalesYear===null&&years.length)viewingSalesYear=years[0];

  const h=el("h2",{},"💵 سجل المبيعات");c.appendChild(h);
  const sub=el("p",{style:"color:#64748b;font-size:13px;margin-bottom:14px"},"بيع المواد الخام مباشرة — استخدم زر 💵 بيع في تبويب المخزون");
  c.appendChild(sub);

  if(!S.sales.length){
    const empty=div("empty");empty.innerHTML='<div style="font-size:40px;margin-bottom:10px">💵</div><div>لا يوجد مبيعات بعد</div><div style="font-size:13px;margin-top:6px">روح لتبويب المخزون واضغط 💵 بيع على أي مادة</div>';
    c.appendChild(empty);return;
  }

  if(years.length>0){
    const ybar=div("","display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px");
    years.forEach(y=>{
      const yb=el("button",{class:"nav-btn"+(y===viewingSalesYear?" active":""),style:"font-size:12px"},"📁 "+y);
      yb.onclick=()=>{viewingSalesYear=y;render();};
      ybar.appendChild(yb);
    });
    c.appendChild(ybar);
  }

  const list=S.sales.filter(s=>(s.year||new Date().getFullYear())===viewingSalesYear);
  if(!list.length){
    const empty=div("empty");empty.innerHTML='<div style="font-size:40px;margin-bottom:10px">💵</div><div>لا يوجد مبيعات لسنة '+viewingSalesYear+'</div>';
    c.appendChild(empty);return;
  }

  let totalProfit=0,hasProfit=false;
  list.forEach(s=>{if(s.profit!=null){totalProfit+=s.profit;hasProfit=true;}});
  if(hasProfit){
    const pb=div("price-box","margin-bottom:14px;border-color:"+(totalProfit>=0?"rgba(34,197,94,0.4)":"rgba(239,68,68,0.4)"));
    pb.innerHTML='<span class="price-label">'+(totalProfit>=0?'📈 إجمالي أرباح '+viewingSalesYear:'📉 إجمالي خسائر '+viewingSalesYear)+'</span><span class="price-total" style="color:'+(totalProfit>=0?'#4ade80':'#f87171')+'">'+Math.abs(totalProfit).toFixed(2)+' ريال</span>';
    c.appendChild(pb);
  }
  list.forEach(s=>{
    const cd=card();
    const top=div("","display:flex;justify-content:space-between;margin-bottom:8px");
    top.innerHTML='<span style="font-weight:700;font-size:15px">💵 '+esc(s.materialName)+'</span><span style="font-size:12px;color:#64748b">'+esc(s.date)+'</span>';
    cd.appendChild(top);
    const body=div("","font-size:13px;color:#94a3b8;line-height:1.8");
    let html='<div>الكمية: '+s.qty+' '+esc(s.unit)+'</div>';
    html+='<div>👤 العميل: '+esc(custNameOf(s)||'بدون عميل')+'</div>';
    if(s.note)html+='<div>📝 '+esc(s.note)+'</div>';
    if(s.cost)html+='<div>التكلفة: '+s.cost.toFixed(2)+' ريال</div>';
    if(s.salePrice)html+='<div>سعر البيع: '+s.salePrice.toFixed(2)+' ريال</div>';
    body.innerHTML=html;
    cd.appendChild(body);
    if(s.profit!=null){
      const pb2=div("price-box","margin-top:8px;border-color:"+(s.profit>=0?"rgba(34,197,94,0.4)":"rgba(239,68,68,0.4)"));
      pb2.innerHTML='<span class="price-label">'+(s.profit>=0?'📈 الربح':'📉 الخسارة')+'</span><span class="price-total" style="color:'+(s.profit>=0?'#4ade80':'#f87171')+'">'+Math.abs(s.profit).toFixed(2)+' ريال</span>';
      cd.appendChild(pb2);
    }
    const delBtn=el("button",{class:"btn-danger",style:"margin-top:8px;width:100%"},"🗑️ حذف");
    delBtn.onclick=()=>deleteSale(s.id);
    cd.appendChild(delBtn);
    c.appendChild(cd);
  });
}

function rCustomers(c){
  if(viewingCustId){
    const cust=S.customers.find(c=>c.id===viewingCustId);
    if(!cust){viewingCustId=null;}
    else{
      const top=div("section-title");
      const h=el("h2",{style:"margin:0"},"👤 "+cust.name);
      const backBtn=el("button",{class:"btn btn-ghost",style:"width:auto"},"⬅️ رجوع");
      backBtn.onclick=()=>{viewingCustId=null;render();};
      top.appendChild(h);top.appendChild(backBtn);
      c.appendChild(top);

      const infoCard=card();
      let infoHtml="";
      if(cust.phone)infoHtml+='<div style="margin-bottom:6px">📞 '+esc(cust.phone)+'</div>';
      if(cust.location)infoHtml+='<div style="margin-bottom:6px">📍 '+esc(cust.location)+'</div>';
      if(cust.taxId)infoHtml+='<div style="margin-bottom:6px">🧾 الرقم الضريبي: '+esc(cust.taxId)+'</div>';
      infoCard.innerHTML=infoHtml||'<div style="color:#64748b">لا توجد بيانات إضافية</div>';
      c.appendChild(infoCard);
      if((cust.files||[]).length){
        const fc=card();fc.appendChild(el("div",{style:"font-weight:600;margin-bottom:6px"},"📎 الملفات"));
        cust.files.forEach(f=>{
          const r=div("row","padding:6px 0;border-top:1px solid #26324D;font-size:12px");
          r.appendChild(el("span",{style:"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},f.name+" ("+fmtSize(f.size)+")"));
          const ob=el("button",{class:"sb p",style:"flex:0 0 60px"},"فتح");ob.onclick=()=>openFile(f.id,f.name,f.type);
          r.appendChild(ob);fc.appendChild(r);
        });
        c.appendChild(fc);
      }

      const purchases=cust.purchases||[];
      let totalProfit=0,totalSales=0;
      purchases.forEach(p=>{if(p.profit!=null)totalProfit+=p.profit;if(p.salePrice)totalSales+=p.salePrice;});
      if(totalSales>0){
        const sumCard=div("price-box","margin-bottom:14px");
        sumCard.innerHTML='<span class="price-label">💰 إجمالي مشترياته</span><span class="price-total">'+totalSales.toFixed(2)+' ريال</span>';
        c.appendChild(sumCard);
        if(totalProfit){
          const profCard=div("price-box","margin-bottom:14px;border-color:"+(totalProfit>=0?"rgba(34,197,94,0.4)":"rgba(239,68,68,0.4)"));
          profCard.innerHTML='<span class="price-label">'+(totalProfit>=0?'📈 صافي الربح منه':'📉 صافي الخسارة')+'</span><span class="price-total" style="color:'+(totalProfit>=0?'#4ade80':'#f87171')+'">'+Math.abs(totalProfit).toFixed(2)+' ريال</span>';
          c.appendChild(profCard);
        }
      }

      const h3=el("h2",{style:"font-size:16px;margin-bottom:10px"},"📜 سجل المشتريات");
      c.appendChild(h3);
      if(!purchases.length){
        const empty=div("empty");empty.innerHTML='<div style="font-size:40px;margin-bottom:10px">📜</div><div>لا يوجد مشتريات بعد</div>';
        c.appendChild(empty);return;
      }
      purchases.forEach(p=>{
        const cd=card();
        const top=div("","display:flex;justify-content:space-between;margin-bottom:6px");
        top.innerHTML='<span style="font-weight:700;font-size:14px">'+(p.type==="formula"?"🧪":"💵")+' '+esc(p.name)+'</span><span style="font-size:12px;color:#64748b">'+esc(p.date)+'</span>';
        cd.appendChild(top);
        if(p.note){const nt=div("","font-size:12px;color:#94a3b8;margin-bottom:4px");nt.textContent="📝 "+p.note;cd.appendChild(nt);}
        if(p.salePrice){
          const pr=div("","font-size:13px;color:#94a3b8");
          pr.innerHTML='سعر البيع: '+p.salePrice.toFixed(2)+' ريال'+(p.profit!=null?' · <span style="color:'+(p.profit>=0?'#4ade80':'#f87171')+'">'+(p.profit>=0?'ربح':'خسارة')+': '+Math.abs(p.profit).toFixed(2)+' ريال</span>':'');
          cd.appendChild(pr);
        }
        c.appendChild(cd);
      });
      return;
    }
  }

  const top=div("section-title");
  const h=el("h2",{style:"margin:0"},"👤 العملاء");
  const addBtn=el("button",{class:"btn",style:"width:auto;padding:8px 16px;font-size:13px"},"➕ عميل جديد");
  addBtn.onclick=()=>openCustModal();
  top.appendChild(h);top.appendChild(addBtn);
  c.appendChild(top);

  if(!S.customers.length){
    const empty=div("empty");empty.innerHTML='<div style="font-size:40px;margin-bottom:10px">👤</div><div>لا يوجد عملاء بعد</div><div style="font-size:13px;margin-top:6px">اضغط "عميل جديد" لإضافة أول عميل</div>';
    c.appendChild(empty);return;
  }
  S.customers.forEach(cust=>{
    const cd=card();
    const top2=div("","display:flex;justify-content:space-between;align-items:center;margin-bottom:10px");
    const info=div();
    let sub="";
    if(cust.phone)sub+=cust.phone;
    if(cust.location)sub+=(sub?" · ":"")+cust.location;
    info.innerHTML='<div style="font-weight:700;font-size:15px">'+esc(cust.name)+'</div>'+(sub?'<div style="font-size:12px;color:#94a3b8">'+esc(sub)+'</div>':'');
    const purchCount=(cust.purchases||[]).length;
    const badge=el("span",{style:"font-size:12px;color:#a5b4fc;background:rgba(99,102,241,0.15);padding:3px 10px;border-radius:20px"},purchCount+" عملية شراء"+((cust.files||[]).length?" · 📎"+cust.files.length:""));
    top2.appendChild(info);top2.appendChild(badge);
    cd.appendChild(top2);
    if((cust.files||[]).length){const fr=div("","display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px");
      cust.files.forEach(f=>{const b=el("button",{class:"chip",style:"max-width:100%;overflow:hidden;text-overflow:ellipsis"},"📎 "+f.name);b.onclick=()=>openFile(f.id,f.name,f.type);fr.appendChild(b);});cd.appendChild(fr);}
    const btnRow=div("row");
    const viewBtn=el("button",{class:"btn-blue",style:"flex:2"},"📜 سجل المشتريات");
    viewBtn.onclick=()=>viewCustomer(cust.id);
    const editBtn=el("button",{class:"btn btn-ghost",style:"flex:1"},"✏️");
    editBtn.onclick=()=>openCustModal(cust.id);
    const delBtn=el("button",{class:"btn-danger"},"🗑️");
    delBtn.onclick=()=>deleteCustomer(cust.id);
    btnRow.appendChild(viewBtn);btnRow.appendChild(editBtn);btnRow.appendChild(delBtn);
    cd.appendChild(btnRow);
    c.appendChild(cd);
  });
}

load();render();

</script>
