<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1E2646">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sct-theme")||"dark")}catch(e){}</script>
<link rel="manifest" href="sct-manifest-v2.json">
<link rel="icon" type="image/png" href="sct-icon-192.png">
<link rel="apple-touch-icon" href="sct-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عاصفة الكيمياء">
<title>مؤسسة عاصفة الكيمياء</title>
<style>
:root{--bg:#1E2646;--sf:#29325A;--sf2:#323C69;--bd:rgba(255,255,255,.10);--tx:#F4F6FF;--mu:#A3ABCC;--ac:#EE6C62;--ac2:#D95A50;--gr:#22C55E;--rd:#EF4444;--am:#F59E0B;--hd:#29325A;--wn:#FBBF24;--okc:#4ADE80;--rdc:#F87171;--sky:#7DD3FC;--or:#FDBA74;--lnk:#A5B4FC;--cs:dark}
:root[data-theme="light"]{--bg:#F3F3F8;--sf:#FFFFFF;--sf2:#EEF0F8;--bd:#E1E3EE;--tx:#1B1B2F;--mu:#6B7091;--ac:#5B3FD9;--ac2:#4A31B8;--hd:#5B3FD9;--wn:#B45309;--okc:#15803D;--rdc:#DC2626;--sky:#0369A1;--or:#C2410C;--lnk:#4338CA;--cs:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;font-size:13px;direction:rtl;color:var(--tx);padding-bottom:24px}
input,select,button,textarea{font-family:inherit;direction:rtl;color:var(--tx);font-size:13px}
input::placeholder,textarea::placeholder{color:var(--mu)}
.header{background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;position:static}
.logo-wrap{display:flex;align-items:center;gap:8px}
.logo-img{height:34px;width:34px;border-radius:8px;object-fit:cover}
.company-name{font-weight:700;font-size:13px}.company-sub{font-size:10px;color:var(--mu)}
.header-btns{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.btn-export,.btn-import-label{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11px;font-weight:600;display:inline-block}
.warn{border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600}
.warn-stock{background:rgba(245,158,11,.15);border:1px solid var(--am);color:var(--wn)}
.warn-overdue{background:rgba(239,68,68,.15);border:1px solid var(--rd);color:var(--rdc);cursor:pointer}
.nav{display:flex;gap:4px;padding:6px 12px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:90;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex:0 0 auto;padding:7px 12px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--mu);white-space:nowrap}
.nav-btn.active{background:var(--ac);color:#fff}
.content{padding:10px 12px;max-width:820px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.card-green{border-color:rgba(34,197,94,.4)}
.card-edit{border-color:var(--ac)!important}
.inp{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px;outline:none}
.inp:focus{border-color:var(--ac)}
.inp option{background:var(--sf)}
label.lbl{display:block;margin-bottom:3px;font-size:11px;color:var(--mu)}
.btn{padding:9px 14px;border-radius:7px;border:none;background:var(--ac);color:#fff;font-size:13px;font-weight:700;cursor:pointer;width:100%}
.btn:active{background:var(--ac2)}
.btn-green{background:#16A34A}
.btn-ghost{background:var(--sf2);color:var(--mu);border:1px solid var(--bd)}
.btn-blue{background:var(--sf2);color:var(--lnk);border:1px solid var(--bd);border-radius:7px;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:700}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--rdc);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600}
.sb{flex:1;padding:6px 4px;border-radius:6px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.sb.p{background:var(--ac);border-color:var(--ac);color:#fff}.sb.d{color:var(--rdc);flex:0 0 36px}
.chip{flex:0 0 auto;padding:5px 10px;border-radius:14px;border:1px solid var(--bd);background:transparent;color:var(--mu);font-size:11.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--sf2);border-color:var(--ac);color:var(--ac)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600}
.t-mix{background:rgba(56,189,248,.12);color:var(--sky)}.t-sale{background:rgba(249,115,22,.14);color:var(--or)}
.t-red{background:rgba(239,68,68,.15);color:var(--rdc)}.t-am{background:rgba(245,158,11,.15);color:var(--wn)}.t-gy{background:rgba(148,163,184,.12);color:var(--mu)}
.row{display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.empty{text-align:center;padding:30px 16px;background:var(--sf);border-radius:10px;color:var(--mu)}
.price-box{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:7px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center}
.price-total{font-size:14px;font-weight:700;color:var(--wn)}.price-label{font-size:12px;color:var(--mu)}
.alert-box{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;color:#fff;padding:9px 18px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.4);font-weight:600;font-size:13px;display:none;max-width:92vw;text-align:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:998;display:none;align-items:center;justify-content:center;padding:14px}
.modal-overlay.open{display:flex}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto}
h2{font-size:16px;font-weight:700;margin-bottom:8px}
.status-badge{border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rpd{font-size:11px;color:var(--wn);margin-top:2px}
.logbox{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:8px;max-height:200px;overflow-y:auto;font-size:11.5px}
.logbox .li{padding:5px 0;border-top:1px solid var(--bd);color:var(--mu)}.logbox .li:first-child{border-top:none}

.header{background:var(--hd);color:#fff;border-bottom:none}
.company-name{color:#fff}.company-sub{color:rgba(255,255,255,.78)}
.content{padding-bottom:96px}
.bk{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.bk:active{background:rgba(255,255,255,.3)}
.t-ok{background:rgba(34,197,94,.15);color:var(--okc)}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.hs{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:9px 4px;text-align:center;cursor:pointer}
.hs b{display:block;font-size:18px;font-weight:700}.hs span{font-size:11px;color:var(--mu)}.hs.w b{color:var(--ac)}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:14px}
.tile{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px 4px 10px;cursor:pointer;color:var(--tx);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:7px}
.tile .ib{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--tb);color:var(--ic)}
:root:not([data-theme="light"]) .tile .ib{background:rgba(255,255,255,.07);color:var(--ac)}
.al{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;margin-bottom:5px;cursor:pointer;font-size:12.5px}
.al .d{width:8px;height:8px;border-radius:50%;flex-shrink:0}.al em{font-style:normal;margin-right:auto;color:var(--mu);font-size:11px}
.sec{font-size:12px;color:var(--mu);margin:4px 2px 6px;font-weight:600}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:95;display:flex;justify-content:space-around;background:var(--sf);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;background:none;border:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;cursor:pointer;padding:4px 0}
.bnav button.a{color:var(--ac);font-weight:700}
.mrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;color:var(--tx)}
.mrow b{display:block;font-size:13.5px}.mrow small{font-size:11px;color:var(--mu)}
.mi{width:38px;height:38px;border-radius:12px;background:var(--sf2);color:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer;background:var(--sf2)}
.pbar{height:5px;background:var(--bd);border-radius:3px;margin-top:6px}.pbar i{display:block;height:5px;background:var(--gr);border-radius:3px}
</style>
</head>
<body>
<div class="alert-box" id="alertBox"></div>
<div class="modal-overlay" id="applyModal">
  <div class="modal">
    <h3 style="margin-bottom:4px">🧪 تطبيق خلطة</h3>
    <p id="applyModalName" style="color:var(--mu);font-size:14px;margin-bottom:14px"></p>
    <label class="lbl" id="applyQtyLbl">كم مرة تريد تطبيق الخلطة؟</label>
    <input type="number" min="0" step="any" value="1" id="applyQtyInput" class="inp" style="text-align:center;font-size:18px;margin-bottom:6px" oninput="updateApplyPreview()">
    <div id="applyQtyHint" style="font-size:12px;color:var(--mu);text-align:center;margin-bottom:12px">مثال: 1 = دفعة واحدة</div>
    <div id="applyModalItems" style="background:rgba(255,255,255,0.04);border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px;color:var(--mu)"></div>
    <div id="applyTotalPrice"></div>
    <label class="lbl" style="margin-top:10px">العميل (اختياري)</label>
    <select id="applyCustomer" class="inp" style="margin-bottom:10px"><option value="">بدون عميل</option></select>
    <label class="lbl">ملاحظات السجل (رقم الفاتورة، اسم المشروع...)</label>
    <input id="applyNote" class="inp" style="margin-bottom:10px" placeholder="اختياري - بتظهر بالسجل وبتقريره">
    <label class="lbl">سعر البيع للزبون (ريال، اختياري)</label>
    <input type="number" id="applySalePrice" class="inp" placeholder="مثال: 500" style="margin-bottom:6px" oninput="updateApplyPreview()">
    <div id="applyProfitBox"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeApplyModal()">إلغاء</button>
      <button class="btn" style="flex:2" onclick="confirmApply()">✅ تأكيد الخصم</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="saleModal">
  <div class="modal">
    <h3 style="margin-bottom:4px">💵 بيع مادة خام</h3>
    <p id="saleModalName" style="color:var(--mu);font-size:14px;margin-bottom:14px"></p>
    <label class="lbl">الكمية المباعة</label>
    <input type="number" id="saleQtyInput" class="inp" style="margin-bottom:10px" oninput="updateSalePreview()">
    <label class="lbl">العميل (اختياري)</label>
    <select id="saleCustomer" class="inp" style="margin-bottom:10px"><option value="">بدون عميل</option></select>
    <label class="lbl">ملاحظات البيع (اختياري)</label>
    <textarea id="saleNote" class="inp" rows="2" placeholder="مثال: رقم الفاتورة، المشروع، طريقة الدفع" style="margin-bottom:10px"></textarea>
    <label class="lbl">سعر البيع الإجمالي (ريال، اختياري)</label>
    <input type="number" id="saleSalePrice" class="inp" placeholder="مثال: 200" style="margin-bottom:8px" oninput="updateSalePreview()">
    <div id="saleProfitBox"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeSaleModal()">إلغاء</button>
      <button class="btn" style="flex:2" onclick="confirmSale()">✅ تأكيد البيع</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="custModal">
  <div class="modal">
    <h3 style="margin-bottom:14px" id="custModalTitle">👤 عميل جديد</h3>
    <label class="lbl">اسم العميل</label><input id="cName" class="inp" style="margin-bottom:10px">
    <label class="lbl">رقم الهاتف</label><input id="cPhone" class="inp" style="margin-bottom:10px">
    <label class="lbl">الموقع</label><input id="cLocation" class="inp" style="margin-bottom:10px">
    <label class="lbl">الرقم الضريبي</label><input id="cTaxId" class="inp" style="margin-bottom:10px">
    <label class="lbl">ملفات العميل (مثل العنوان الوطني، صورة أو PDF)</label>
    <div class="btn btn-ghost" style="position:relative;text-align:center;margin-bottom:4px;overflow:hidden">📎 إرفاق ملف<input type="file" multiple accept="image/*,application/pdf,.pdf" onchange="addFiles('cust',this)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px"></div>
    <div id="cFileList" style="margin-bottom:12px"></div>
    <div class="row">
      <button class="btn btn-ghost" style="flex:1" onclick="cancelCust()">إلغاء</button>
      <button class="btn" style="flex:2" onclick="saveCustomer()">💾 حفظ</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="projModal"><div class="modal">
  <h3 style="margin-bottom:12px" id="projModalTitle">📁 مشروع جديد</h3>
  <label class="lbl">اسم المشروع</label><input id="pName" class="inp" style="margin-bottom:8px">
  <div class="grid2" style="margin-bottom:8px"><div><label class="lbl">العميل</label><select id="pCust" class="inp"></select></div>
  <div><label class="lbl">الحالة</label><select id="pStatus" class="inp"><option>قيد التنفيذ</option><option>معلّق</option><option>مكتمل</option></select></div></div>
  <label class="lbl">أو اكتب اسم العميل</label><input id="pCustName" class="inp" style="margin-bottom:8px">
  <label class="lbl">موقع المشروع</label><input id="pLoc" class="inp" style="margin-bottom:8px">
  <div class="grid2" style="margin-bottom:8px"><div><label class="lbl">تاريخ البدء</label><input id="pStart" type="date" class="inp" style="color-scheme:var(--cs)"></div>
  <div><label class="lbl">تاريخ التسليم</label><input id="pEnd" type="date" class="inp" style="color-scheme:var(--cs)"></div></div>
  <div class="grid2" style="margin-bottom:8px"><div><label class="lbl">قيمة العقد (ريال)</label><input id="pValue" type="number" step="any" class="inp"></div>
  <div><label class="lbl">المدفوع مسبقاً (ريال)</label><input id="pPaid" type="number" step="any" class="inp"></div></div>
  <label class="lbl">وصف المشروع</label><textarea id="pDesc" class="inp" rows="3" style="margin-bottom:8px;resize:vertical"></textarea>
  <label class="lbl">صور وملفات المشروع (عقد، مخططات، صور الموقع...)</label>
  <div class="btn btn-ghost" style="position:relative;text-align:center;margin-bottom:4px;overflow:hidden">📎 إرفاق صور أو ملفات<input type="file" multiple accept="*/*" onchange="addFiles('proj',this)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px"></div>
  <div id="pFileList" style="margin-bottom:12px"></div>
  <div class="row"><button class="btn btn-ghost" style="flex:1" onclick="cancelProj()">إلغاء</button><button class="btn" style="flex:2" onclick="saveProj()">💾 حفظ</button></div>
</div></div>
<div class="modal-overlay" id="hnModal"><div class="modal">
  <h3 style="margin-bottom:12px">📝 ملاحظات السجل</h3>
  <textarea id="hnText" class="inp" rows="4" placeholder="مثال: فاتورة رقم 1250 - مشروع ملعب الرياض" style="margin-bottom:12px;resize:vertical"></textarea>
  <div class="row"><button class="btn btn-ghost" style="flex:1" onclick="closeHistNote()">إلغاء</button><button class="btn" style="flex:2" onclick="saveHistNote()">💾 حفظ</button></div>
</div></div>
<div class="modal-overlay" id="catModal"><div class="modal">
  <h3 style="margin-bottom:12px" id="catTitle">🗂️ تصنيف جديد</h3>
  <label class="lbl">اسم التصنيف</label><input id="catName" class="inp" placeholder="مثال: دهانات داخلية" style="margin-bottom:12px">
  <div class="row"><button class="btn btn-ghost" style="flex:1" onclick="closeCatModal()">إلغاء</button><button class="btn" style="flex:2" onclick="saveCat()">💾 حفظ</button></div>
</div></div>
<div class="modal-overlay" id="vchModal"><div class="modal">
  <h3 style="margin-bottom:12px" id="vchTitle">🧾 سند قبض</h3>
  <div class="grid2" style="margin-bottom:8px"><div><label class="lbl">العميل</label><select id="vCust" class="inp" onchange="fillVchProj()"></select></div>
  <div><label class="lbl">أو اكتب الاسم</label><input id="vCustName" class="inp"></div></div>
  <div class="grid2" style="margin-bottom:8px"><div><label class="lbl">المبلغ (ريال)</label><input id="vAmount" type="number" step="any" class="inp"></div>
  <div><label class="lbl">التاريخ</label><input id="vDate" type="date" class="inp" style="color-scheme:var(--cs)"></div></div>
  <div class="grid2" style="margin-bottom:8px"><div><label class="lbl">طريقة الدفع</label><select id="vMethod" class="inp"></select></div>
  <div><label class="lbl">رقم مرجع (شيك / حوالة)</label><input id="vRef" class="inp"></div></div>
  <label class="lbl" id="vProjLbl">المشروع (اختياري)</label><select id="vProj" class="inp" style="margin-bottom:8px"></select>
  <label class="lbl">ملاحظات</label><textarea id="vNote" class="inp" rows="2" style="margin-bottom:8px;resize:vertical"></textarea>
  <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px;cursor:pointer"><input type="checkbox" id="vBooked" style="width:18px;height:18px"> تم تسجيله بالمحاسبة</label>
  <div class="row"><button class="btn btn-ghost" style="flex:1" onclick="closeVchModal()">إلغاء</button><button class="btn" style="flex:2" onclick="saveVch()">💾 حفظ</button></div>
</div></div>
<div class="modal-overlay" id="payModal"><div class="modal">
  <h3 style="margin-bottom:12px" id="payTitle">💳 تسجيل دفعة</h3>
  <div class="grid2" style="margin-bottom:8px"><div><label class="lbl">المبلغ (ريال)</label><input id="payAmt" type="number" step="any" class="inp"></div>
  <div><label class="lbl">التاريخ</label><input id="payDate" type="date" class="inp" style="color-scheme:var(--cs)"></div></div>
  <label class="lbl">طريقة الدفع</label><select id="payMethod" class="inp" style="margin-bottom:8px"></select>
  <label class="lbl">ملاحظة</label><input id="payNote" class="inp" style="margin-bottom:8px" placeholder="مثال: الدفعة الأولى">
  <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px;cursor:pointer"><input type="checkbox" id="payMakeV" style="width:18px;height:18px"> أنشئ سند قبض لهالدفعة</label>
  <div class="row"><button class="btn btn-ghost" style="flex:1" onclick="closePayModal()">إلغاء</button><button class="btn" style="flex:2" onclick="savePay()">💾 حفظ الدفعة</button></div>

<script>

const SK="paint_factory_v2";
let S={materials:[],history:[],savedFormulas:[],approvedFormulas:[],tasks:[],archivedHistory:{},customers:[],sales:[],projects:[],vouchers:[],formulaCats:[],quotes:[]};
let currentView="home",applyingId=null,editingMatId=null,editingFormulaId=null;

function save(){try{syncMeta();}catch(e){}try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){showAlert("تعذّر حفظ البيانات على هذا الجهاز! صدّر نسخة احتياطية الآن","error");}updateWarnings();}
function load(){try{const s=localStorage.getItem(SK);if(s){const p=JSON.parse(s);S={materials:p.materials||[],history:p.history||[],savedFormulas:p.savedFormulas||[],approvedFormulas:p.approvedFormulas||[],tasks:p.tasks||[],archivedHistory:p.archivedHistory||{},customers:p.customers||[],sales:p.sales||[],projects:p.projects||[],vouchers:p.vouchers||[],formulaCats:p.formulaCats||[],quotes:p.quotes||[]};migrateOldEntries();}}catch(e){}}

let aT;
function showAlert(msg,type){const el=document.getElementById("alertBox");el.textContent=msg;el.style.background=type==="error"?"#ef4444":"#22c55e";el.style.display="block";clearTimeout(aT);aT=setTimeout(()=>el.style.display="none",3000);}

function updateWarnings(){
  const low=S.materials.filter(isLow);
  const ex=S.materials.filter(m=>{const d=daysToExp(m);return d!==null&&d<=60;});
  const ew=document.getElementById("expWarn");
  if(ew){ew.style.display=ex.length?"":"none";ew.textContent="⏳ "+ex.length+" صلاحية";}
  const lw=document.getElementById("lowStockWarn");
  if(lw){lw.style.display=low.length?"":"none";lw.textContent="⚠️ "+low.length+" مواد منخفضة";}
  const ov=S.tasks.filter(t=>{const d=getDaysLeft(t);return d!==null&&d<0;});
  const ow=document.getElementById("overdueWarn");
  if(ow){ow.style.display=ov.length?"":"none";ow.textContent="🔧 "+ov.length+" مهام متأخرة";}
}

let navDepth=0;
function goBack(){if(navDepth>0){history.back();}else showView("home",true);}
function showView(v,np){
  const prev=currentView;currentView=v;editingMatId=null;editingFormulaId=null;
  if(!np&&prev!==v){try{history.pushState({v:v},"");navDepth++;}catch(e){}}
  try{window.scrollTo(0,0);}catch(e){}
  render();
}
window.addEventListener("popstate",e=>{navDepth=Math.max(0,navDepth-1);showView((e.state&&e.state.v)||"home",true);});
try{history.replaceState({v:"home"},"");}catch(e){}
const VT={home:"الرئيسية",inventory:"المخزون",addMaterial:"إضافة مواد",savedFormulas:"الخلطات",approvedFormulas:"الخلطات المعتمدة",history:"سجل الخلطات",maintenance:"المواعيد",sales:"المبيعات",customers:"العملاء",projects:"المشاريع",receipts:"سندات القبض",formulaCat:"تصنيف الخلطات",quotes:"عروض الأسعار",quoteForm:"عرض سعر",payments:"سندات الصرف",more:"المزيد"};
function updChrome(){
  const bb=document.getElementById("backBtn");if(bb)bb.style.display=currentView==="home"?"none":"flex";
  const h=document.getElementById("hsub");if(h)h.textContent=currentView==="home"?"إدارة المخزون والخلطات":(VT[currentView]||"");
  const m={home:"home",inventory:"inventory",sales:"sales",more:"more",customers:"more",receipts:"more",payments:"more",quotes:"more",quoteForm:"more"};
  ["home","inventory","sales","more"].forEach(k=>{const b=document.getElementById("bn-"+k);if(b)b.classList.toggle("a",m[currentView]===k);});
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const UNITS=["كغ","غ","لتر","مل","طن","برميل","طبلية","حبة","كيس 20 كغ","كيس 25 كغ","كيس 50 كغ","برميل 50 لتر","برميل 100 لتر","برميل 200 لتر"];
function unitOpts(sel){const l=UNITS.includes(sel)||!sel?UNITS:[sel].concat(UNITS);return l.map(u=>'<option'+(u===sel?' selected':'')+'>'+esc(u)+'</option>').join("");}
function matOpts(sel){return '<option value="">اختر المادة</option>'+S.materials.filter(m=>m.category!=="sale"||m.id===sel).map(m=>'<option value="'+m.id+'"'+(m.id===sel?' selected':'')+'>'+esc(m.name)+' ('+m.quantity+' '+esc(m.unit)+')</option>').join("");}
function isLow(m){const t=m.min>0?m.min:10;return m.quantity<t;}
function daysToExp(m){if(!m.expiry)return null;const d=new Date(m.expiry+"T00:00:00");if(isNaN(d))return null;const n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/864e5);}
function expTag(m){const d=daysToExp(m);if(d===null)return "";if(d<0)return '<span class="tag t-red">منتهية منذ '+(-d)+' يوم</span>';if(d<=60)return '<span class="tag t-am">تنتهي بعد '+d+' يوم</span>';return '<span class="tag t-gy">صلاحية '+m.expiry.split("-").reverse().join("/")+'</span>';}
function getStockColor(m){return m.quantity<=0?"#ef4444":isLow(m)?"#f59e0b":"#22c55e";}
function taskBase(t){if(t.lastDone)return t.lastDone;const ts=Number(t.id);if(!isNaN(ts)&&ts>1e12){const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}return null;}
function getDaysLeft(t){const base=taskBase(t);if(!base)return null;const n=new Date(base+"T00:00:00");if(isNaN(n))return null;n.setDate(n.getDate()+t.intervalDays);const now=new Date();now.setHours(0,0,0,0);return Math.round((n-now)/864e5);}
function getTaskColor(d){return d===null?"var(--mu)":d<0?"#ef4444":d<=3?"#f59e0b":"#22c55e";}
function getTaskStatus(d){return d===null?"لم تُنجز بعد":d<0?"متأخر "+Math.abs(d)+" يوم":d===0?"اليوم!":"بعد "+d+" يوم";}
function iLabel(d){return({1:"كل يوم",2:"يوم إي يوم لا (كل يومين)",7:"كل أسبوع",14:"كل أسبوعين",30:"كل شهر",60:"كل شهرين",90:"كل 3 أشهر",180:"كل 6 أشهر",365:"كل سنة"})[d]||"كل "+d+" يوم";}
/* ===== units ===== */
function unitInfo(u){u=(u||"").trim();const m=u.match(/^(?:كيس|برميل)\s+(\d+(?:\.\d+)?)\s*(كغ|لتر)$/);if(m)return{b:m[2],f:+m[1]};const t={"كغ":["كغ",1],"غ":["كغ",0.001],"طن":["كغ",1000],"لتر":["لتر",1],"مل":["لتر",0.001]}[u];return t?{b:t[0],f:t[1]}:null;}
function conv(a,from,to){if(!from||!to||from===to)return a;const x=unitInfo(from),y=unitInfo(to);return(x&&y&&x.b===y.b)?a*x.f/y.f:a;}
function unitChoices(m){if(!m)return[""];const i=unitInfo(m.unit);const extra=i?(i.b==="كغ"?["كغ","غ","طن"]:["لتر","مل"]):[];return[m.unit].concat(extra.filter(x=>x!==m.unit));}
function rowU(row,m){return row.unit||(m?m.unit:"");}
function rowStock(row,m){return m?conv(parseFloat(row.amount)||0,rowU(row,m),m.unit):0;}
function rowCost(row,m){return m&&m.pricePerUnit?m.pricePerUnit*rowStock(row,m):0;}
function fTotal(rows){return rows.reduce((s,r)=>s+rowCost(r,S.materials.find(m=>m.id===r.materialId)),0);}
/* ===== batches (FEFO: first expiry, first out) ===== */
function ensureBatches(m){if(!m.batches)m.batches=m.quantity>0?[{id:"b0",qty:m.quantity,expiry:m.expiry||"",note:"",ts:0}]:[];}
function syncMat(m){ensureBatches(m);m.batches=m.batches.filter(b=>b.qty>0.0005);m.quantity=+m.batches.reduce((s,b)=>s+b.qty,0).toFixed(3);const ex=m.batches.map(b=>b.expiry).filter(Boolean).sort();m.expiry=ex[0]||"";}
function addBatch(m,qty,expiry,note){ensureBatches(m);const b=expiry?m.batches.find(x=>x.expiry===expiry):null;if(b)b.qty=+(b.qty+qty).toFixed(3);else m.batches.push({id:"b"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),qty:+qty.toFixed(3),expiry:expiry||"",note:note||"",ts:Date.now()});syncMat(m);}
function takeStock(m,qty){ensureBatches(m);m.batches.sort((a,b)=>(a.expiry||"9999")<(b.expiry||"9999")?-1:1);let r=qty;for(const b of m.batches){if(r<=0)break;const t=Math.min(b.qty,r);b.qty=+(b.qty-t).toFixed(3);r=+(r-t).toFixed(3);}syncMat(m);}
function setBatchExp(mid,bid,v){const m=S.materials.find(x=>x.id===mid);const b=m&&m.batches.find(x=>x.id===bid);if(!b)return;b.expiry=v;syncMat(m);save();drawInvList();}
function delBatch(mid,bid){const m=S.materials.find(x=>x.id===mid);const b=m&&m.batches.find(x=>x.id===bid);if(!b||!confirm("حذف هذه الدفعة ("+b.qty+" "+m.unit+") من المخزون؟"))return;b.qty=0;syncMat(m);save();render();}

async function exportData(){
  const fileData={};
  try{for(const c of S.customers.concat(S.materials,S.projects,S.savedFormulas,S.approvedFormulas))for(const f of (c.files||[])){const b=await getFile(f.id);if(b)fileData[f.id]=await toDataUrl(b);}}catch(e){}
  const blob=new Blob([JSON.stringify({...S,fileData,exportedAt:new Date().toLocaleString("ar-SA")},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="عاصفة-الكيمياء-"+new Date().toISOString().split("T")[0]+".json";a.click();
  showAlert("تم تصدير البيانات ✅");
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      if(!Array.isArray(p.materials)){showAlert("ملف غير صحيح","error");return;}
      if(!confirm("سيتم استبدال كل البيانات الحالية ببيانات الملف. هل تريد المتابعة؟"))return;
      S={materials:p.materials||[],history:p.history||[],savedFormulas:p.savedFormulas||[],approvedFormulas:p.approvedFormulas||[],tasks:p.tasks||[],archivedHistory:p.archivedHistory||{},customers:p.customers||[],sales:p.sales||[],projects:p.projects||[],vouchers:p.vouchers||[],formulaCats:p.formulaCats||[],quotes:p.quotes||[]};
      if(p.fileData){for(const id in p.fileData){try{const b=await (await fetch(p.fileData[id])).blob();await putFile(id,b);}catch(e){}}}
      migrateOldEntries();save();render();showAlert("تم الاستيراد ✅");
    }catch{showAlert("خطأ في الملف","error");}
  };
  r.readAsText(f);e.target.value="";
}

function fy(f){
  if(f.yieldQty>0)return{qty:f.yieldQty,unit:f.yieldUnit||"لتر",auto:false};
  let sum=0;
  f.rows.forEach(r=>{const m=S.materials.find(x=>x.id===r.materialId);if(!m)return;const i=unitInfo(rowU(r,m));if(!i)return;sum+=(parseFloat(r.amount)||0)*i.f;});
  return sum>0?{qty:+sum.toFixed(3),unit:"كغ",auto:true}:null;
}

  });

  {const Y=fy(f);if(total>0&&Y){const v=parseFloat(document.getElementById("applyQtyInput").value)||0;if(v>0)tb.innerHTML+='<div style="font-size:12px;color:var(--mu);text-align:center;margin-top:4px">التكلفة لكل '+esc(Y.unit)+': <b>'+(total/v).toFixed(2)+'</b> ريال</div>';}}

  } else pb.innerHTML="";
}
function confirmApply(){
  const f=S.approvedFormulas.find(f=>f.id===applyingId);
  const qty=f?applyFactor(f):NaN;
  if(!f||isNaN(qty)||qty<=0){showAlert("كمية غير صحيحة","error");return;}
  const need={};
  for(const row of f.rows){
    const m=S.materials.find(m=>m.id===row.materialId);
    if(!m){showAlert("مادة غير موجودة","error");return;}
    need[m.id]=(need[m.id]||0)+rowStock(row,m)*qty;
  }
  const updates=[];
  let cost=0;
  for(const id in need){
    const m=S.materials.find(m=>m.id===id);
    const amt=+need[id].toFixed(3);
    if(m.quantity<amt){showAlert("المخزون غير كافٍ لـ "+m.name,"error");return;}
    updates.push({id:m.id,name:m.name,unit:m.unit,used:amt});
    if(m.pricePerUnit)cost+=m.pricePerUnit*amt;
  }
  updates.forEach(u=>takeStock(S.materials.find(m=>m.id===u.id),u.used));
  const custId=document.getElementById("applyCustomer").value;
  const cust=S.customers.find(c=>c.id===custId);
  const salePrice=parseFloat(document.getElementById("applySalePrice").value)||0;
  const entry={id:Date.now(),formulaId:f.id,note:(document.getElementById("applyNote")||{value:""}).value.trim(),date:new Date().toLocaleString("ar-SA"),year:new Date().getFullYear(),name:f.name+(fy(f)?" ("+(+(qty*fy(f).qty).toFixed(2))+" "+fy(f).unit+")":(qty!==1?" (×"+(+qty.toFixed(2))+")":"")),items:updates.map(u=>({name:u.name,used:u.used,unit:u.unit})),customerId:custId||null,customerName:cust?cust.name:null,cost:+cost.toFixed(2),salePrice:salePrice,profit:salePrice?+(salePrice-cost).toFixed(2):null};
  S.history.unshift(entry);
  if(cust){if(!cust.purchases)cust.purchases=[];cust.purchases.unshift({type:"formula",date:entry.date,name:entry.name,cost:entry.cost,salePrice:entry.salePrice,profit:entry.profit});}
  closeApplyModal();save();showView("inventory");showAlert("تم تطبيق "+f.name+" ✅");
}

function openSaleModal(matId){
  sellingMatId=matId;
  const m=S.materials.find(m=>m.id===matId);
  document.getElementById("saleModalName").textContent=m.name+" — متوفر: "+m.quantity+" "+m.unit;
  document.getElementById("saleQtyInput").value="";
  document.getElementById("saleSalePrice").value="";
  document.getElementById("saleNote").value="";
  document.getElementById("saleCustomer").innerHTML=custOptions();
  document.getElementById("saleProfitBox").innerHTML="";
  document.getElementById("saleModal").classList.add("open");
}
function closeSaleModal(){document.getElementById("saleModal").classList.remove("open");sellingMatId=null;}
function updateSalePreview(){
  const m=S.materials.find(m=>m.id===sellingMatId);if(!m)return;
  const qty=parseFloat(document.getElementById("saleQtyInput").value);
  const salePrice=parseFloat(document.getElementById("saleSalePrice").value);
  const pb=document.getElementById("saleProfitBox");
  if(!isNaN(qty)&&qty>0&&m.pricePerUnit&&!isNaN(salePrice)&&salePrice>0){
    const cost=m.pricePerUnit*qty;
    const profit=salePrice-cost;
    pb.innerHTML='<div class="price-box" style="border-color:'+(profit>=0?'rgba(34,197,94,0.4)':'rgba(239,68,68,0.4)')+'"><span class="price-label">'+(profit>=0?'📈 الربح':'📉 الخسارة')+'</span><span class="price-total" style="color:'+(profit>=0?'var(--okc)':'var(--rdc)')+'">'+Math.abs(profit).toFixed(2)+' ريال</span></div>';
  } else pb.innerHTML="";
}
function confirmSale(){
  const m=S.materials.find(m=>m.id===sellingMatId);
  const qty=parseFloat(document.getElementById("saleQtyInput").value);
  if(!m||isNaN(qty)||qty<=0){showAlert("كمية غير صحيحة","error");return;}
  if(m.quantity<qty){showAlert("المخزون غير كافٍ","error");return;}
  const custId=document.getElementById("saleCustomer").value;
  const cust=S.customers.find(c=>c.id===custId);
  const salePrice=parseFloat(document.getElementById("saleSalePrice").value)||0;
  const cost=m.pricePerUnit?m.pricePerUnit*qty:0;
  const note=document.getElementById("saleNote").value.trim();
  takeStock(m,qty);
  const entry={id:Date.now(),date:new Date().toLocaleString("ar-SA"),year:new Date().getFullYear(),materialId:m.id,materialName:m.name,note:note,qty:qty,unit:m.unit,cost:+cost.toFixed(2),salePrice:salePrice,profit:salePrice?+(salePrice-cost).toFixed(2):null,customerId:custId||null,customerName:cust?cust.name:null};
  S.sales.unshift(entry);
  if(cust){if(!cust.purchases)cust.purchases=[];cust.purchases.unshift({type:"material",date:entry.date,name:m.name+" ("+qty+" "+m.unit+")",note:note,cost:entry.cost,salePrice:entry.salePrice,profit:entry.profit});}
  closeSaleModal();save();render();showAlert("تم تسجيل بيع "+m.name+" ✅");
}
function deleteSale(id){if(!confirm("حذف سجل هذا البيع؟ (لن تعود الكمية للمخزون)"))return;S.sales=S.sales.filter(s=>s.id!==id);save();render();showAlert("تم الحذف","error");}

function idb(){return new Promise((res,rej)=>{if(!window.indexedDB){rej(new Error("no idb"));return;}const r=indexedDB.open("sct_files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbPut(id,b){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(b,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbGet(id){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction("f").objectStore("f").get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbDel(id){try{const d=await idb();d.transaction("f","readwrite").objectStore("f").delete(id);}catch(e){}}
function toDataUrl(b){return new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(b);});}
async function putFile(id,b){try{await idbPut(id,b);}catch(e){if(b.size>1500000)throw e;localStorage.setItem("sctf_"+id,await toDataUrl(b));}}
async function getFile(id){try{const b=await idbGet(id);if(b)return b;}catch(e){}const u=localStorage.getItem("sctf_"+id);return u?await (await fetch(u)).blob():null;}
function delFile(id){idbDel(id);try{localStorage.removeItem("sctf_"+id);}catch(e){}}
function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";}
function attachHtml(k){return '<div class="btn btn-ghost" style="position:relative;text-align:center;margin-bottom:4px;overflow:hidden">📎 إرفاق ملف (PDF أو صورة)<input type="file" multiple accept="image/*,application/pdf,.pdf" onchange="addFiles(\''+k+'\',this)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px"></div>';}
function renderFiles(k){
  const box=document.getElementById(FC[k].box);if(!box)return;box.innerHTML="";
  FC[k].tmp.forEach(f=>{
    const r=div("row","padding:5px 0;border-top:1px solid var(--bd);font-size:12px");
    r.appendChild(el("span",{style:"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},"📎 "+f.name+" ("+fmtSize(f.size)+")"));
    const x=el("button",{class:"sb d"},"✕");
    x.onclick=()=>{const st=FC[k];st.tmp=st.tmp.filter(t=>t.id!==f.id);if(st.added.includes(f.id)){st.added=st.added.filter(i=>i!==f.id);delFile(f.id);}else st.removed.push(f.id);renderFiles(k);};
    const ob=el("button",{class:"sb p",style:"flex:0 0 56px"},"فتح");ob.onclick=()=>openFile(f.id,f.name,f.type);
    r.appendChild(ob);r.appendChild(x);box.appendChild(r);
  });
}
async function addFiles(k,inp){
  const fs=[...inp.files];inp.value="";
  if(!fs.length)return;
  for(const f of fs){
    if(f.size>10*1048576){showAlert("الملف أكبر من 10 ميغابايت: "+f.name,"error");continue;}
    try{const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await putFile(id,f);FC[k].tmp.push({id,name:f.name,type:f.type,size:f.size});FC[k].added.push(id);}
    catch(e){showAlert("تعذّر حفظ الملف على هذا الجهاز: "+f.name,"error");}
  }
  renderFiles(k);
}
function addCustFiles(inp){return addFiles("cust",inp);}
function finishFiles(k){FC[k].removed.forEach(delFile);FC[k].added=[];FC[k].removed=[];}
function abortFiles(k){FC[k].added.forEach(delFile);FC[k].added=[];FC[k].removed=[];}
async function openFile(id,name,type){
  try{
    const b=await getFile(id);
    if(!b){showAlert("الملف غير موجود على هذا الجهاز","error");return;}
    const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.rel="noopener";
    const isPdf=(type||b.type||"").includes("pdf")||/\.pdf$/i.test(name||"");
    if(isPdf){a.download=name||"file.pdf";showAlert("جاري تنزيل الملف... افتحه من الإشعارات أو التنزيلات");}
    else a.target="_blank";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),60000);
  }catch(e){showAlert("تعذّر فتح الملف","error");}
}

function addTask(){
  const name=document.getElementById("tName").value.trim();
  const dv=document.getElementById("tDays").value;
  const days=dv==="custom"?parseInt(document.getElementById("tCustom").value):parseInt(dv);
  if(!(days>=1)){showAlert("اكتب عدد الأيام (رقم من 1 فما فوق)","error");return;}
  const last=document.getElementById("tLast").value;
  if(!name){showAlert("الرجاء كتابة اسم المهمة","error");return;}
  S.tasks.push({id:Date.now().toString(),name,intervalDays:days,lastDone:last||"",remind:parseInt(document.getElementById("tRemind").value)});
  save();render();showAlert("تمت الإضافة ✅");
}

function migrateOldEntries(){
  S.materials.forEach(m=>{ensureBatches(m);syncMat(m);});
  // دمج السجلات المؤرشفة يدوياً قديماً (إن وجدت) ضمن نفس قائمة السجل، مع تعيين سنة افتراضية
  if(S.archivedHistory&&Object.keys(S.archivedHistory).length){
    Object.entries(S.archivedHistory).forEach(([yr,list])=>{
      list.forEach(e=>{if(!e.year)e.year=parseInt(yr);S.history.push(e);});
    });
    S.archivedHistory={};
  }
  // أي سجل قديم بدون حقل year ياخذ سنة تاريخه أو السنة الحالية كحل أخير
  S.history.forEach(e=>{if(!e.year)e.year=new Date().getFullYear();});
  S.sales.forEach(e=>{if(!e.year)e.year=new Date().getFullYear();});
}

let scanStream=null,scanTimer=null;
function scanInto(id){openScan(v=>{const e=document.getElementById(id);if(e)e.value=v;});}
async function openScan(cb){
  if(!("BarcodeDetector" in window)){showAlert("المتصفح ما بيدعم مسح الباركود. اكتب الرقم يدوياً","error");return;}
  document.getElementById("scanModal").classList.add("open");
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const v=document.getElementById("scanVideo");v.srcObject=scanStream;await v.play();
    const det=new BarcodeDetector();
    scanTimer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length){const val=r[0].rawValue;closeScan();cb(val);}}catch(e){}},400);
  }catch(e){closeScan();showAlert("تعذّر فتح الكاميرا. تأكد من السماح للتطبيق باستخدامها","error");}
}
function closeScan(){clearInterval(scanTimer);if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}document.getElementById("scanModal").classList.remove("open");}

/* ===== maintenance reminders ===== */
const REM=[[0,"في نفس يوم الموعد"],[1,"قبل يوم"],[2,"قبل يومين"],[3,"قبل 3 أيام"],[7,"قبل أسبوع"]];

function taskIcs(t){
  const r=t.remind==null?1:t.remind;
  const due=new Date();due.setHours(0,0,0,0);
  const base=taskBase(t);
  if(base){const n=new Date(base+"T00:00:00");n.setDate(n.getDate()+t.intervalDays);if(n>due)due.setTime(n.getTime());}
  const alarmAt=d=>{const x=new Date(d);x.setDate(x.getDate()-r);x.setHours(9,0,0,0);return x;};
  let g=0;while(alarmAt(due)<=new Date()&&g++<800)due.setDate(due.getDate()+t.intervalDays);
  const ymd=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0");
  const nx=new Date(due);nx.setDate(nx.getDate()+1);
  const trig=r>0?"-PT"+(24*r-9)+"H":"PT9H";
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SCT//Maintenance//AR","CALSCALE:GREGORIAN","BEGIN:VEVENT","UID:"+t.id+"@sct","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z",
    "DTSTART;VALUE=DATE:"+ymd(due),"DTEND;VALUE=DATE:"+ymd(nx),"RRULE:FREQ=DAILY;INTERVAL="+t.intervalDays,"SUMMARY:🔧 "+t.name,
    "DESCRIPTION:موعد صيانة دوري - مؤسسة عاصفة الكيمياء","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+t.name,"TRIGGER:"+trig,"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function addToCalendar(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([taskIcs(t)],{type:"text/calendar;charset=utf-8"}));a.download="maintenance-"+id+".ics";
  document.body.appendChild(a);a.click();a.remove();
  showAlert("افتح الملف من التنزيلات واختار التقويم لإضافة التذكير");
}
function syncMeta(){return new Promise(res=>{try{if(!window.indexedDB){res();return;}const r=indexedDB.open("sct_meta",1);r.onupgradeneeded=()=>r.result.createObjectStore("m");
  r.onsuccess=()=>{const tx=r.result.transaction("m","readwrite");tx.objectStore("m").put(S.tasks.map(t=>({name:t.name,intervalDays:t.intervalDays,lastDone:taskBase(t),remind:t.remind==null?1:t.remind})),"tasks");tx.oncomplete=()=>res();tx.onerror=()=>res();};r.onerror=()=>res();}catch(e){res();}});}

    if(f){d.onclick=()=>{VF[type]="no";render();};}else d.style.cursor="default";st.appendChild(d);
  });
  c.appendChild(st);
  const bar=div("","display:flex;gap:6px;overflow-x:auto;margin-bottom:8px");
  [["","الكل"],["no","⏳ غير مسجّل"],["yes","✅ مسجّل"]].forEach(([k,t])=>{const b=el("button",{class:"chip"+(VF[type]===k?" on":"")},t);b.onclick=()=>{VF[type]=k;render();};bar.appendChild(b);});
  c.appendChild(bar);
  const q=el("input",{class:"inp",placeholder:"🔍 ابحث باسم العميل أو المرجع أو الملاحظة...",style:"margin-bottom:8px;padding:7px 10px"});q.value=VF.q;
  q.onchange=()=>{VF.q=q.value;render();};c.appendChild(q);
  const qq=VF.q.trim().toLowerCase();
  const list=all.filter(v=>(!VF[type]||(VF[type]==="no"?!v.booked:v.booked))&&(!qq||((v.customerName||"")+" "+(v.ref||"")+" "+(v.note||"")+" "+vNo(v)).toLowerCase().includes(qq)))
    .sort((a,b)=>(b.date||"")<(a.date||"")?-1:(b.date||"")>(a.date||"")?1:(b.seq||0)-(a.seq||0));
  if(!list.length){const e=div("empty");e.textContent=all.length?"لا توجد سندات بهالفلتر":"لا توجد سندات بعد. اضغط «+ سند جديد».";c.appendChild(e);return;}
  list.forEach(v=>{
    const cd=card();
    const tg=el("span",{class:"tag "+(v.booked?"t-ok":"t-am"),style:"flex-shrink:0"},v.booked?"✅ مسجّل":"⏳ غير مسجّل");
    const body=foldHead(cd,"v"+v.id,'<div style="font-weight:700;font-size:14px">'+esc(v.customerName)+'</div><div style="font-size:11px;color:var(--mu);margin-top:1px">'+vNo(v)+' · '+fmtD(v.date)+'</div>',fmtMoney(v.amount)+" ر",tg);
    const p=S.projects.find(x=>x.id===v.projectId);
    const d=div("","margin-top:8px;font-size:12.5px;line-height:1.9");
    d.innerHTML='<div>💳 '+esc(v.method||"—")+(v.ref?' · مرجع: '+esc(v.ref):'')+'</div>'+(p?'<div>📁 '+esc(p.name)+'</div>':'')+(v.note?'<div style="color:var(--mu);white-space:pre-wrap">'+esc(v.note)+'</div>':'')+(v.booked?'<div style="color:var(--okc)">✅ سُجّل بالمحاسبة بتاريخ '+fmtD(v.bookedAt)+'</div>':'');
    body.appendChild(d);
    const bk=el("button",{class:"btn"+(v.booked?" btn-ghost":" btn-green"),style:"margin-top:8px"},v.booked?"↩ إلغاء علامة التسجيل":"✔ تم التسجيل بالمحاسبة");
    bk.onclick=()=>toggleBooked(v.id);body.appendChild(bk);
    const row=div("row","margin-top:8px");
    const e1=el("button",{class:"sb"},"✏️ تعديل");e1.onclick=()=>openVchModal(v.type,v.id);
    const s1=el("button",{class:"sb"},"📤 مشاركة");s1.onclick=()=>shareVch(v.id);
    const d1=el("button",{class:"sb d"},"🗑️");d1.onclick=()=>deleteVch(v.id);
    row.appendChild(e1);row.appendChild(s1);row.appendChild(d1);body.appendChild(row);
    c.appendChild(cd);
  });
}
function openPayModal(pid){
  payProjId=pid;const p=S.projects.find(x=>x.id===pid);if(!p)return;const $=i=>document.getElementById(i);
  $("payTitle").textContent="💳 دفعة — "+p.name;$("payAmt").value="";$("payDate").value=todayStr();$("payNote").value="";
  $("payMethod").innerHTML=PM.map(m=>'<option>'+m+'</option>').join("");
  $("payMakeV").checked=!!(p.customerId||p.customerName);
  $("payModal").classList.add("open");
}
function closePayModal(){document.getElementById("payModal").classList.remove("open");}
function savePay(){
  const p=S.projects.find(x=>x.id===payProjId);if(!p)return;const g=i=>document.getElementById(i).value.trim();
  const amount=parseFloat(g("payAmt"));if(!(amount>0)){showAlert("اكتب مبلغ صحيح","error");return;}
  const rec={id:"pay"+Date.now().toString(36),date:g("payDate")||todayStr(),amount,method:g("payMethod"),note:g("payNote")};
  if(document.getElementById("payMakeV").checked){
    const v={id:"v"+Date.now().toString(36),seq:nextSeq("in"),created:Date.now(),type:"in",customerId:p.customerId||"",customerName:custNameOf(p)||"بدون اسم",amount,date:rec.date,method:rec.method,ref:"",projectId:p.id,note:"دفعة مشروع: "+p.name+(rec.note?" — "+rec.note:""),booked:false,bookedAt:""};
    S.vouchers.unshift(v);rec.voucherId=v.id;
  }
  p.payments=p.payments||[];p.payments.push(rec);
  closePayModal();save();render();showAlert("تم تسجيل الدفعة ✅"+(rec.voucherId?" وإنشاء سند قبض":""));
}
function delPay(pid,payId){
  const p=S.projects.find(x=>x.id===pid);const rec=p&&(p.payments||[]).find(x=>x.id===payId);if(!rec)return;
  const v=rec.voucherId&&S.vouchers.find(x=>x.id===rec.voucherId);
  if(!confirm("حذف هذه الدفعة ("+fmtMoney(rec.amount)+" ريال)؟"+(v?(v.booked?"\nسند القبض المرتبط مسجّل بالمحاسبة وسيبقى.":"\nوسيُحذف سند القبض المرتبط لأنه غير مسجّل بالمحاسبة."):"")))return;
  p.payments=p.payments.filter(x=>x.id!==payId);
  if(v&&!v.booked)S.vouchers=S.vouchers.filter(x=>x.id!==v.id);
  save();render();showAlert("تم حذف الدفعة","error");
}

    const row=[pairs[i],pairs[i+1]].filter(Boolean);let hmax=1;const cells=row.map(p=>{this.font(18,false);const w1=this.x.measureText(p[0]+":").width;this.font(RP.FS-1,true);const ls=this.wrap(p[1]===""||p[1]==null?"—":p[1],cw-w1-24);hmax=Math.max(hmax,ls.length);return{p,w1,ls};});

Rep.prototype.table=function(cols,rows,o){

    const px=cols[i].a==="l"?edge(i)-widths[i]+pad:cols[i].a==="c"?edge(i)-widths[i]/2:edge(i)-pad;x.fillText(txt,px,y);};

  push(enc("%PDF-1.4\n"));const N=jpegs.length;
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+jpegs.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"] /Count "+N+" >>");
  jpegs.forEach((j,i)=>{const p=3+3*i,c=p+1,im=p+2,cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(p,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+im+" 0 R >> >> /Contents "+c+" 0 R >>");
    obj(c,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
    offsets[im]=off;push(enc(im+" 0 obj\n<< /Type /XObject /Subtype /Image /Width "+wpx+" /Height "+hpx+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+j.length+" >>\nstream\n"));push(j);push(enc("\nendstream\nendobj\n"));});
  const total=3*N+3,xr=off;let x="xref\n0 "+total+"\n0000000000 65535 f \n";
  for(let n=1;n<total;n++)x+=String(offsets[n]).padStart(10,"0")+" 00000 n \n";
  push(enc(x+"trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF"));
  const out=new Uint8Array(off);let p=0;parts.forEach(b=>{out.set(b,p);p+=b.length;});return out;
}

  setTimeout(()=>{try{document.getElementById("catName").focus();}catch(e){}},50);
}
function closeCatModal(){document.getElementById("catModal").classList.remove("open");catAssign=null;catEditId=null;}
function saveCat(){
  const name=document.getElementById("catName").value.trim();if(!name){showAlert("اكتب اسم التصنيف","error");return;}
  if(S.formulaCats.some(c=>c.name===name&&c.id!==catEditId)){showAlert("هذا التصنيف موجود مسبقاً","error");return;}
  if(catEditId){S.formulaCats=S.formulaCats.map(c=>c.id===catEditId?{...c,name}:c);}
  else{const nc={id:"fc"+Date.now().toString(36),name};S.formulaCats.push(nc);if(catAssign){const f=S.approvedFormulas.find(x=>x.id===catAssign);if(f)f.cat=nc.id;}}
  closeCatModal();save();render();showAlert("تم حفظ التصنيف ✅");
}
function deleteCat(id){
  const c=S.formulaCats.find(x=>x.id===id);if(!c)return;const n=catCount(id);
  if(!confirm("حذف التصنيف «"+c.name+"»؟"+(n?"\nالخلطات اللي فيه ("+n+") رح تصير غير مصنّفة، وما بتنحذف.":"")))return;
  S.approvedFormulas.forEach(f=>{if(f.cat===id)f.cat="";});S.savedFormulas.forEach(f=>{if(f.cat===id)f.cat="";});
  S.formulaCats=S.formulaCats.filter(x=>x.id!==id);save();render();showAlert("تم حذف التصنيف","error");
}
function openCat(id){viewingCat=id;showView("formulaCat");}
function rApproved(c){
  const top=div("section-title");top.appendChild(el("h2",{style:"margin:0"},"✅ الخلطات المعتمدة"));
  const nb=el("button",{class:"btn",style:"width:auto;padding:8px 14px"},"+ تصنيف");nb.onclick=()=>openCatModal();top.appendChild(nb);c.appendChild(top);
  c.appendChild(el("p",{style:"color:var(--mu);font-size:12.5px;margin-bottom:10px;line-height:1.7"},"صنّف خلطاتك بمجموعات (مثل: دهانات داخلية، دهانات خارجية). اضغط على تصنيف لتشوف خلطاته."));
  const row=(icon,title,n,fn,acts)=>{
    const r=div("mrow");r.innerHTML='<span class="mi" style="font-size:18px">'+icon+'</span><span style="flex:1;text-align:right"><b>'+esc(title)+'</b><small>'+n+' خلطة</small></span>';
    (acts||[]).forEach(([t,f,cls])=>{const b=el("button",{class:"sb"+(cls?" "+cls:""),style:"flex:0 0 38px;padding:7px 0"},t);b.onclick=ev=>{ev.stopPropagation();f();};r.appendChild(b);});
    r.appendChild(el("span",{style:"color:var(--mu)"},"‹"));r.onclick=fn;c.appendChild(r);
  };
  row("📋","كل الخلطات المعتمدة",S.approvedFormulas.length,()=>openCat("all"));
  S.formulaCats.forEach(ct=>row("🗂️",ct.name,catCount(ct.id),()=>openCat(ct.id),[["✏️",()=>openCatModal(ct.id)],["🗑️",()=>deleteCat(ct.id),"d"]]));
  const nn=catCount("none");if(nn>0)row("📦","غير مصنّف",nn,()=>openCat("none"));
  if(!S.approvedFormulas.length){const e=div("empty");e.innerHTML='<div style="font-size:34px;margin-bottom:8px">✅</div><div>لا توجد خلطات معتمدة بعد. اعتمد خلطة من تبويب الخلطات.</div>';c.appendChild(e);}
}
function rFormulaCat(c){
  const ct=S.formulaCats.find(x=>x.id===viewingCat);
  if(viewingCat!=="all"&&viewingCat!=="none"&&!ct){currentView="approvedFormulas";rApproved(c);return;}
  const list=viewingCat==="all"?S.approvedFormulas:viewingCat==="none"?S.approvedFormulas.filter(f=>!catExists(f.cat)):S.approvedFormulas.filter(f=>f.cat===viewingCat);
  const title=viewingCat==="all"?"📋 كل الخلطات المعتمدة":viewingCat==="none"?"📦 غير مصنّف":"🗂️ "+ct.name;
  rApprovedList(c,list,title,list.length+" خلطة — جاهزة للتطبيق مباشرة على المخزون");
}

/* ===== applied-formula record: note + confidential one-page report ===== */
let histNoteId=null;
function openHistNote(id){const e=S.history.find(x=>x.id===id);if(!e)return;histNoteId=id;document.getElementById("hnText").value=e.note||"";document.getElementById("hnModal").classList.add("open");}
function closeHistNote(){document.getElementById("hnModal").classList.remove("open");histNoteId=null;}
function saveHistNote(){const e=S.history.find(x=>x.id===histNoteId);if(!e)return;e.note=document.getElementById("hnText").value.trim();closeHistNote();save();render();showAlert("تم حفظ الملاحظة ✅");}
async function reportHistory(id){
  const e=S.history.find(x=>x.id===id);if(!e)return;
  const f=S.approvedFormulas.concat(S.savedFormulas).find(x=>x.id===e.formulaId);
  const fname=f?f.name:String(e.name||"").replace(/\s*\([^)]*\)\s*$/,"");
  const ts=Number(e.id),ok=ts>1e12,d=ok?new Date(ts):null;
  const dateS=ok?dstr(ts):(e.date||"—");
  const day=ok?d.toLocaleDateString("ar-SA",{weekday:"long"}):"—";
  let time="—";if(ok){let h=d.getHours();const m=String(d.getMinutes()).padStart(2,"0"),ap=h>=12?"م":"ص";h=h%12||12;time=h+":"+m+" "+ap;}
  const r=await startReport("سجل خلطة: "+fname,nowStr());
  r.kv([["التاريخ",dateS],["اليوم",day],["الوقت",time],["العميل",custNameOf(e)||"بدون عميل"]]);
  r.kv([["الخلطة",fname]]);
  r.section("ملاحظات");
  r.table([{h:"الملاحظة",w:1}],[[e.note||"—"]]);
  r.note("هذا السجل لا يتضمن المكونات أو الكميات أو الأسعار.",15);
  doneReport(r,"سجل-خلطة-"+fname+"-"+dateS.replace(/\//g,"-"));
}

function qCalc(q){
  const r2=v=>Math.round(v*100)/100,lines=(q.items||[]).map(it=>r2((+it.qty||0)*(+it.price||0))),sub=r2(lines.reduce((a,b)=>a+b,0));

  return{lines,sub,disc,base,rate,tax:r2(tax),total:r2(base+tax)};
}

const expandedF=new Set();let foldReg={};
function foldHead(cd,key,title,sub,extra){
  cd.style.padding="0";
  const open=expandedF.has(key);
  const head=div("row","padding:10px 12px;gap:8px;cursor:pointer");
  const info=div("","flex:1;min-width:0");info.innerHTML=title;
  const subEl=el("span",{style:"font-size:11px;color:var(--mu);flex-shrink:0;white-space:nowrap"},sub);
  const chev=el("span",{style:"color:var(--mu);font-size:10px;flex-shrink:0"},open?"▲":"▼");
  head.appendChild(info);head.appendChild(subEl);if(extra)head.appendChild(extra);head.appendChild(chev);
  cd.appendChild(head);
  const body=div("","padding:0 12px 10px;border-top:1px solid var(--bd);display:"+(open?"block":"none"));
  cd.appendChild(body);
  foldReg[key]={body,chev};
  head.onclick=()=>{
    const o=body.style.display==="none";
    if(o){[...expandedF].forEach(k=>{const r=foldReg[k];if(k!==key&&k[0]===key[0]&&r){r.body.style.display="none";r.chev.textContent="▼";expandedF.delete(k);}});expandedF.add(key);}
    else expandedF.delete(key);
    body.style.display=o?"block":"none";chev.textContent=o?"▲":"▼";
  };
  return body;
}

function deleteHistory(id){

let viewingSalesYear=null,salesPeriod="year",salesFrom="",salesTo="";
const QN={q1:"يناير – مارس",q2:"أبريل – يونيو",q3:"يوليو – سبتمبر",q4:"أكتوبر – ديسمبر"},QL={q1:"الربع الأول",q2:"الربع الثاني",q3:"الربع الثالث",q4:"الربع الرابع"};
function saleTs(s){const t=Number(s.id);return isNaN(t)?null:t;}
function salesInPeriod(){
  let list=S.sales.slice();
  if(salesPeriod==="range"){
    const f=salesFrom?new Date(salesFrom+"T00:00:00").getTime():-Infinity,t=salesTo?new Date(salesTo+"T23:59:59.999").getTime():Infinity;
    return list.filter(s=>{const ts=saleTs(s);return ts!==null&&ts>=f&&ts<=t;});
  }
  list=list.filter(s=>(s.year||new Date().getFullYear())===viewingSalesYear);
  if(/^q\d$/.test(salesPeriod)){const qn=+salesPeriod[1]-1;list=list.filter(s=>{const ts=saleTs(s);return ts!==null&&Math.floor(new Date(ts).getMonth()/3)===qn;});}
  return list;
}
